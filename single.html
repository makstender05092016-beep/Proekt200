<script>
/* ПРОЕКТ 200 — Факультет физики: курс с нуля (авторский текст) */
'use strict';
(function () {
  const { F, R } = P;
  const T = o => { o.subj = 'phys'; o.n = P.TOPICS.filter(t => t.subj === 'phys').length + 1; P.TOPICS.push(o); };

  T({ id: 'p1', title: 'Что такое физика', short: 'Предмет физики, явления, законы, модели',
    theory: `<h3>Предмет физики</h3><p>Физика изучает самые общие свойства материи и законы её движения: как движутся тела, почему они взаимодействуют, что такое тепло, электричество, свет, атом. Физика — фундамент инженерии, химии, медицины и всей техники.</p>
<h3>Физическое явление</h3><p>Любое изменение, происходящее с телами: падение камня (механическое), кипение воды (тепловое), свечение лампы (электрическое и световое).</p>
<h3>Как работает физика</h3><ol><li><b>Наблюдение и опыт</b>: явление изучают, меняя условия и измеряя величины.</li><li><b>Гипотеза</b> — предположение о причине.</li><li><b>Закон</b> — устойчивая количественная связь между величинами, подтверждённая опытом (например, F = ma).</li><li><b>Теория</b> объединяет законы и предсказывает новые явления.</li></ol>
<h3>Модели</h3><p>Физика всегда упрощает реальность. <b>Материальная точка</b> — тело, размерами которого можно пренебречь в данной задаче (Земля при движении вокруг Солнца). <b>Идеальный газ</b> — газ, молекулы которого не взаимодействуют на расстоянии. Модель применима, только пока её упрощения не влияют на результат.</p>
<h3>Разделы школьной физики</h3><p>Механика → молекулярная физика и термодинамика → электродинамика → колебания и волны → оптика → квантовая физика. Именно в таком порядке построен этот факультет: каждый следующий раздел опирается на предыдущий.</p>`,
    sum: ['Физика — наука о наиболее общих законах природы', 'Явление → опыт → гипотеза → закон → теория', 'Модель — сознательное упрощение (материальная точка, идеальный газ)', 'Порядок курса: механика → МКТ и термодинамика → электродинамика → оптика → квантовая физика'],
    f: [], defs: [['Физическое явление', 'изменение, происходящее с телами или веществом'], ['Физический закон', 'устойчивая, проверенная опытом связь между физическими величинами'], ['Материальная точка', 'тело, размерами которого в данной задаче можно пренебречь']],
    ex: [['Можно ли считать автомобиль материальной точкой?', 'При расчёте времени поездки Москва — Казань — да (размеры ничтожны по сравнению с путём). При парковке в гараж — нет.']],
    err: ['Считать модель «истиной» вне её условий применимости'], gens: ['p_concept'], viz: null, ege: 'Методологические задания' });

  T({ id: 'p2', title: 'Физические величины', short: 'Величина, обозначение, значение, скаляры и векторы',
    theory: `<h3>Что такое физическая величина</h3><p>Свойство тела или явления, которое можно <b>измерить</b> и выразить числом с единицей: масса 2 кг, время 5 с. Запись «m = 2 кг» читается так: обозначение величины (m), числовое значение (2), единица (кг).</p>
<h3>Скалярные и векторные величины</h3><p><b>Скаляр</b> задаётся только числом: масса, время, температура, энергия. <b>Вектор</b> — числом и направлением: скорость, сила, ускорение, перемещение. На письме вектор обозначают стрелкой над буквой; модуль вектора — та же буква без стрелки.</p>
<h3>Основные обозначения</h3><div class="tblw"><table><tr><th>Величина</th><th>Обозн.</th><th>Единица SI</th></tr><tr><td>Длина, путь</td><td>l, s</td><td>м</td></tr><tr><td>Время</td><td>t</td><td>с</td></tr><tr><td>Масса</td><td>m</td><td>кг</td></tr><tr><td>Скорость</td><td>v</td><td>м/с</td></tr><tr><td>Ускорение</td><td>a</td><td>м/с²</td></tr><tr><td>Сила</td><td>F</td><td>Н</td></tr><tr><td>Энергия, работа</td><td>E, A</td><td>Дж</td></tr><tr><td>Мощность</td><td>N, P</td><td>Вт</td></tr><tr><td>Давление</td><td>p</td><td>Па</td></tr><tr><td>Температура</td><td>T</td><td>К</td></tr><tr><td>Заряд</td><td>q</td><td>Кл</td></tr><tr><td>Сила тока</td><td>I</td><td>А</td></tr><tr><td>Напряжение</td><td>U</td><td>В</td></tr><tr><td>Сопротивление</td><td>R</td><td>Ом</td></tr></table></div>
<h3>Греческие буквы</h3><p>α (альфа) — угол, μ (мю) — коэффициент трения, ρ (ро) — плотность, λ (лямбда) — длина волны, ν (ню) — частота или количество вещества, ω (омега) — циклическая частота, η (эта) — КПД, Δ (дельта) — изменение величины: Δt = t₂ − t₁.</p>`,
    sum: ['Величина = число × единица', 'Скаляр: только число (m, t, E)', 'Вектор: число + направление (v, F, a)', 'Δx = x₂ − x₁ — изменение величины'],
    f: [['Изменение величины', 'Δx = x<sub>2</sub> − x<sub>1</sub>']],
    defs: [['Физическая величина', 'измеримая характеристика тела или явления'], ['Вектор', 'величина, имеющая модуль и направление'], ['Скаляр', 'величина, задаваемая только числом']],
    ex: [['Является ли путь вектором?', 'Нет. Путь — длина траектории, скаляр. Перемещение — вектор, соединяющий начальную и конечную точки.']],
    err: ['Путать путь и перемещение', 'Писать число без единицы'], gens: ['p_concept'], viz: null, ege: 'Основа для всех заданий' });

  T({ id: 'p3', title: 'Система единиц SI', short: 'Основные единицы, приставки, перевод единиц',
    theory: `<h3>Основные единицы SI</h3><p>Метр (м), килограмм (кг), секунда (с), ампер (А), кельвин (К), моль, кандела. Все остальные единицы — <b>производные</b>: 1 Н = 1 кг·м/с², 1 Дж = 1 Н·м, 1 Вт = 1 Дж/с, 1 Па = 1 Н/м².</p>
<h3>Приставки</h3><table><tr><td>Г (гига)</td><td>10⁹</td><td>м (милли)</td><td>10⁻³</td></tr><tr><td>М (мега)</td><td>10⁶</td><td>мк (микро)</td><td>10⁻⁶</td></tr><tr><td>к (кило)</td><td>10³</td><td>н (нано)</td><td>10⁻⁹</td></tr><tr><td>с (санти)</td><td>10⁻²</td><td>п (пико)</td><td>10⁻¹²</td></tr></table>
<h3>Перевод единиц</h3><p>Подставляйте вместо единицы её значение: 72 км/ч = 72·${F('1000 м', '3600 с')} = 20 м/с. Короткое правило: км/ч → м/с — разделить на 3,6.</p>
<p>Квадратные и кубические единицы: 1 см² = (10⁻² м)² = 10⁻⁴ м²; 1 л = 1 дм³ = 10⁻³ м³.</p>
<div class="note">Перед вычислением переводите все данные в SI — тогда ответ автоматически получится в единицах SI.</div>`,
    sum: ['Основные: м, кг, с, А, К, моль', 'к = 10³, М = 10⁶, м = 10⁻³, мк = 10⁻⁶, н = 10⁻⁹', 'км/ч : 3,6 = м/с', '1 см² = 10⁻⁴ м²; 1 л = 10⁻³ м³', 'Сначала в SI — потом считать'],
    f: [['Ньютон', '1 Н = 1 кг·м/с<sup>2</sup>'], ['Джоуль', '1 Дж = 1 Н·м'], ['Ватт', '1 Вт = 1 Дж/с'], ['Паскаль', '1 Па = 1 Н/м<sup>2</sup>'], ['км/ч в м/с', `v[м/с] = ${F('v[км/ч]', '3,6')}`]],
    defs: [['Основная единица', 'единица, принятая независимо от других'], ['Производная единица', 'единица, выраженная через основные по формуле']],
    ex: [['Переведите 54 км/ч в м/с', '54 : 3,6 = 15 м/с.'], ['Переведите 5 мм² в м²', '5·(10⁻³)² = 5·10⁻⁶ м².']],
    err: ['Переводят см² как 10⁻² м²', 'Умножают на 3,6 вместо деления'], gens: ['p_units'], viz: null, ege: 'Во всех расчётных задачах' });

  T({ id: 'p4', title: 'Измерения', short: 'Цена деления, погрешность, запись результата',
    theory: `<h3>Цена деления прибора</h3><p>Возьмите два ближайших подписанных штриха, вычтите меньшее значение из большего и разделите на число делений между ними. Пример: между 20 и 30 — 5 делений ⇒ цена деления 2.</p>
<h3>Погрешность</h3><p>Ни одно измерение не точно. Если иное не указано, абсолютную погрешность прямого измерения принимают равной <b>цене деления</b> (иногда — половине цены деления; в ЕГЭ условие это всегда оговаривает). Результат записывают в виде: x = x<sub>изм</sub> ± Δx, например (24 ± 2) мл.</p>
<h3>Относительная погрешность</h3><p>ε = ${F('Δx', 'x')}·100%. Она показывает качество измерения.</p>
<h3>Планирование опыта</h3><p>Чтобы проверить зависимость величины от одного параметра, меняют только его, а остальные оставляют одинаковыми. Этим проверяется умение выбрать «правильную пару опытов» — типичное задание ЕГЭ.</p>`,
    sum: ['Цена деления = (разность соседних подписей)/(число делений)', 'Δx — абсолютная погрешность', 'ε = Δx/x·100%', 'Опыт: меняем один параметр, остальные фиксируем'],
    f: [['Относительная погрешность', `ε = ${F('Δx', 'x')}·100%`]],
    defs: [['Цена деления', 'значение величины, соответствующее одному наименьшему делению шкалы'], ['Абсолютная погрешность', 'граница возможного отклонения измеренного значения от истинного']],
    ex: [['Между штрихами 0 и 10 мл — 5 делений. Цена деления?', '10/5 = 2 мл.']],
    err: ['Считают число штрихов, а не промежутков', 'Меняют в опыте сразу два параметра'], gens: ['p_scale'], viz: null, ege: 'Методологические задания' });

  T({ id: 'p5', title: 'Математический аппарат физики', short: 'Проекции, тригонометрия, пропорции, графики',
    theory: `<h3>Проекция вектора на ось</h3><p>F<sub>x</sub> = F·cos α, где α — угол между вектором и осью x. Проекция положительна, если вектор «смотрит» в сторону оси, отрицательна — если против.</p>
<p>Для угла α с горизонтом: F<sub>x</sub> = F cos α, F<sub>y</sub> = F sin α. Значения: cos 0° = 1; cos 30° ≈ 0,87; cos 45° ≈ 0,71; cos 60° = 0,5; cos 90° = 0.</p>
<h3>Пропорциональности</h3><p>Если y = kx — прямая пропорциональность (увеличили x вдвое — y увеличился вдвое). Если y = k/x — обратная. Если y = kx<sup>2</sup> — при увеличении x в 2 раза y растёт в 4 раза. Это основа «качественных» вопросов: «как изменится сила, если расстояние увеличить в 3 раза?»</p>
<h3>Выражение величины из формулы</h3><p>Из F = ma: a = F/m, m = F/a. Действуем как в уравнении: делим обе части на то, что стоит рядом с искомой величиной.</p>
<h3>Площадь под графиком</h3><p>Площадь под графиком v(t) — путь; под графиком F(x) — работа. Этот приём используется постоянно.</p>`,
    sum: ['Fₓ = F cos α; F_y = F sin α', 'y ~ x² ⇒ x×2 → y×4', 'y ~ 1/x² ⇒ x×2 → y:4', 'Площадь под v(t) = путь'],
    f: [['Проекция вектора', 'F<sub>x</sub> = F cos α'], ['Модуль через проекции', `F = ${R('F<sub>x</sub><sup>2</sup>+F<sub>y</sub><sup>2</sup>')}`]],
    defs: [['Проекция вектора на ось', 'длина «тени» вектора на оси со знаком']],
    ex: [['F = 10 Н под углом 60° к оси x. F<sub>x</sub>?', '10·cos 60° = 5 Н.']],
    err: ['Путают sin и cos при проецировании', 'Забывают знак проекции'], gens: ['p_proj', 'p_ratio'], viz: null, ege: 'Используется во всех разделах' });

  T({ id: 'p6', title: 'Кинематика', short: 'Перемещение, скорость, ускорение, равноускоренное движение, графики',
    theory: `<h3>Основные понятия</h3><p><b>Механическое движение</b> — изменение положения тела относительно других тел с течением времени. Для описания нужна <b>система отсчёта</b>: тело отсчёта, система координат, часы.</p>
<p><b>Траектория</b> — линия движения; <b>путь</b> s — её длина; <b>перемещение</b> — вектор из начала в конец.</p>
<h3>Равномерное прямолинейное движение</h3><p>Скорость постоянна: x = x<sub>0</sub> + v<sub>x</sub>t. График x(t) — прямая, v(t) — горизонтальная линия.</p>
<h3>Равноускоренное движение</h3><p><b>Ускорение</b> a = ${F('Δv', 'Δt')} — быстрота изменения скорости (м/с²).</p>
<p>v = v<sub>0</sub> + at; x = x<sub>0</sub> + v<sub>0</sub>t + ${F('at<sup>2</sup>', 2)}; без времени: v<sup>2</sup> − v<sub>0</sub><sup>2</sup> = 2as.</p>
<p><b>Вывод формулы пути</b>: на графике v(t) путь — площадь трапеции с основаниями v<sub>0</sub> и v, высотой t: s = ${F('v<sub>0</sub> + v', 2)}t = v<sub>0</sub>t + ${F('at<sup>2</sup>', 2)}.</p>
<h3>Свободное падение и бросок</h3><p>У поверхности Земли все тела (без сопротивления воздуха) падают с ускорением g ≈ 9,8 м/с² (в ЕГЭ обычно 10 м/с²). Тело, брошенное под углом α: по горизонтали движение равномерное (v₀cos α), по вертикали — равноускоренное. Дальность L = ${F('v<sub>0</sub><sup>2</sup>sin 2α', 'g')}, максимальная высота H = ${F('v<sub>0</sub><sup>2</sup>sin<sup>2</sup>α', '2g')}.</p>
<h3>Движение по окружности</h3><p>Даже при постоянной по модулю скорости есть центростремительное ускорение a = ${F('v<sup>2</sup>', 'R')} = ω<sup>2</sup>R, направленное к центру. v = ωR, T = ${F('2πR', 'v')}.</p>`,
    sum: ['x = x₀ + vt (равномерное)', 'v = v₀ + at', 's = v₀t + at²/2', 'v² − v₀² = 2as', 'Путь = площадь под v(t)', 'Свободное падение: a = g ≈ 10 м/с²', 'По окружности: a = v²/R'],
    f: [['Ускорение', `a = ${F('v − v<sub>0</sub>', 't')}`], ['Скорость', 'v = v<sub>0</sub> + at'], ['Перемещение', `s = v<sub>0</sub>t + ${F('at<sup>2</sup>', 2)}`], ['Без времени', 'v<sup>2</sup> − v<sub>0</sub><sup>2</sup> = 2as'], ['Свободное падение', `h = ${F('gt<sup>2</sup>', 2)}`], ['Центростремительное ускорение', `a = ${F('v<sup>2</sup>', 'R')}`], ['Дальность полёта', `L = ${F('v<sub>0</sub><sup>2</sup>sin 2α', 'g')}`]],
    defs: [['Система отсчёта', 'тело отсчёта + система координат + часы'], ['Ускорение', 'векторная величина, равная отношению изменения скорости ко времени этого изменения']],
    ex: [['Автомобиль разгоняется из покоя с a = 2 м/с². Какой путь за 5 с?', 's = at²/2 = 2·25/2 = 25 м.']],
    err: ['Путают путь и перемещение', 'Забывают переводить км/ч в м/с', 'Знак ускорения при торможении'], gens: ['p_uni', 'p_accel', 'p_vt', 'p_fall'], viz: null, lab: 'motion', ege: 'Задание 1 и др.' });

  T({ id: 'p7', title: 'Динамика', short: 'Сила, масса, инерция — почему тела движутся',
    theory: `<h3>Главный вопрос динамики</h3><p>Кинематика описывает, <i>как</i> движется тело; динамика объясняет, <i>почему</i>. Причина изменения скорости — <b>взаимодействие</b> с другими телами.</p>
<h3>Сила</h3><p><b>Сила</b> — векторная мера действия одного тела на другое. Единица — ньютон (Н). Сила характеризуется модулем, направлением и точкой приложения. Если на тело действует несколько сил, их заменяют <b>равнодействующей</b> — векторной суммой.</p>
<h3>Масса и инертность</h3><p><b>Инертность</b> — свойство тела сопротивляться изменению скорости. Мера инертности — <b>масса</b> (кг). Чем больше масса, тем меньше ускорение при той же силе.</p>
<h3>Алгоритм решения задач динамики</h3><ol><li>Сделать рисунок, указать все силы, действующие на тело.</li><li>Выбрать оси (одну — вдоль ускорения).</li><li>Записать второй закон Ньютона в векторной форме.</li><li>Спроецировать на оси.</li><li>Решить систему уравнений.</li></ol>`,
    sum: ['Сила — мера взаимодействия, вектор, Н', 'Масса — мера инертности, кг', 'Равнодействующая — векторная сумма сил', 'Рисунок → силы → оси → 2-й закон → проекции'],
    f: [['Равнодействующая', 'F⃗ = F⃗<sub>1</sub> + F⃗<sub>2</sub> + …']],
    defs: [['Сила', 'векторная величина, мера взаимодействия тел'], ['Масса', 'мера инертности тела'], ['Инерция', 'явление сохранения скорости при отсутствии воздействия других тел']],
    ex: [['На тело действуют силы 3 Н и 4 Н под прямым углом. Равнодействующая?', '√(9 + 16) = 5 Н.']],
    err: ['Складывают модули непараллельных сил', 'Добавляют «силу движения», которой нет'], gens: ['p_net', 'p_concept'], viz: null, lab: 'newton', ege: 'Механика' });

  T({ id: 'p8', title: 'Законы Ньютона', short: 'Три закона, инерциальные системы отсчёта',
    theory: `<h3>Первый закон</h3><p>Существуют <b>инерциальные системы отсчёта</b>, в которых тело сохраняет скорость (или покой), если на него не действуют силы или их действие скомпенсировано.</p>
<h3>Второй закон</h3><div class="def"><b>Формулировка.</b> Ускорение тела прямо пропорционально равнодействующей сил и обратно пропорционально массе: a⃗ = ${F('F⃗', 'm')}, или F⃗ = ma⃗.</div><p>Ускорение всегда направлено так же, как равнодействующая (а не как скорость!).</p>
<h3>Третий закон</h3><p>Тела действуют друг на друга с силами, равными по модулю и противоположными по направлению: F⃗<sub>12</sub> = −F⃗<sub>21</sub>. Эти силы приложены к <b>разным</b> телам и поэтому не компенсируют друг друга.</p>
<h3>Вес тела</h3><p>Вес P — сила, с которой тело давит на опору или растягивает подвес. В лифте, движущемся с ускорением a вверх: P = m(g + a); вниз: P = m(g − a); при свободном падении P = 0 (невесомость).</p>`,
    sum: ['1-й: нет силы — нет ускорения (в ИСО)', '2-й: F = ma, a ∥ F', '3-й: F₁₂ = −F₂₁, приложены к разным телам', 'Вес в лифте: P = m(g ± a)'],
    f: [['Второй закон Ньютона', 'F⃗ = ma⃗'], ['Третий закон Ньютона', 'F⃗<sub>12</sub> = −F⃗<sub>21</sub>'], ['Вес при ускорении вверх', 'P = m(g + a)']],
    defs: [['Инерциальная система отсчёта', 'система, в которой выполняется первый закон Ньютона'], ['Вес', 'сила, с которой тело действует на опору или подвес']],
    ex: [['Сила 12 Н сообщает телу ускорение 3 м/с². Масса?', 'm = F/a = 4 кг.']],
    err: ['Считают, что ускорение направлено по скорости', 'Складывают силы третьего закона как действующие на одно тело', 'Путают вес и силу тяжести'], gens: ['p_n2', 'p_lift'], viz: null, lab: 'newton', ege: 'Механика' });

  T({ id: 'p9', title: 'Силы', short: 'Виды сил в механике, изображение сил',
    theory: `<h3>Силы в механике</h3><table><tr><th>Сила</th><th>Формула</th><th>Направление</th></tr><tr><td>Тяжести</td><td>mg</td><td>вертикально вниз</td></tr><tr><td>Упругости (опоры N, натяжения T)</td><td>kx</td><td>против деформации; N ⟂ опоре</td></tr><tr><td>Трения скольжения</td><td>μN</td><td>против скорости относительно поверхности</td></tr><tr><td>Всемирного тяготения</td><td>Gm₁m₂/r²</td><td>к другому телу</td></tr><tr><td>Архимеда</td><td>ρ<sub>ж</sub>gV</td><td>вверх</td></tr></table>
<h3>Как изображать</h3><p>Каждую силу рисуют стрелкой из точки приложения; длина стрелки пропорциональна модулю. Для каждой силы назовите тело, которое её создаёт: если не можете — такой силы нет.</p>
<h3>Сила Архимеда</h3><p>На тело в жидкости действует выталкивающая сила, равная весу вытесненной жидкости: F<sub>А</sub> = ρ<sub>ж</sub>gV<sub>погр</sub>. Тело плавает, если F<sub>А</sub> = mg.</p>`,
    sum: ['Тяжести: mg, вниз', 'Упругости: kx', 'Трения: μN', 'Тяготения: Gm₁m₂/r²', 'Архимеда: ρж g V', 'У каждой силы есть «автор» — тело'],
    f: [['Сила Архимеда', 'F<sub>А</sub> = ρ<sub>ж</sub>gV'], ['Давление жидкости', 'p = ρgh']],
    defs: [['Сила реакции опоры', 'сила упругости, действующая на тело со стороны опоры перпендикулярно ей']],
    ex: [['Тело объёмом 0,002 м³ полностью в воде (ρ = 1000 кг/м³). F_А?', '1000·10·0,002 = 20 Н.']],
    err: ['Рисуют «силу инерции» или «силу движения»', 'Направляют N всегда вертикально, даже на наклонной плоскости'], gens: ['p_arch', 'p_net'], viz: null, lab: 'friction', ege: 'Механика' });

  T({ id: 'p10', title: 'Сила тяжести', short: 'Закон всемирного тяготения, g, спутники',
    theory: `<h3>Закон всемирного тяготения</h3><p>Любые два тела притягиваются с силой F = G${F('m<sub>1</sub>m<sub>2</sub>', 'r<sup>2</sup>')}, G = 6,67·10⁻¹¹ Н·м²/кг². Сила обратно пропорциональна <b>квадрату</b> расстояния: при увеличении r в 2 раза сила уменьшается в 4 раза.</p>
<h3>Ускорение свободного падения</h3><p>Сила тяжести mg — это сила притяжения Земли: mg = G${F('Mm', 'R<sup>2</sup>')} ⇒ g = G${F('M', 'R<sup>2</sup>')}. На высоте h: g<sub>h</sub> = G${F('M', '(R+h)<sup>2</sup>')}.</p>
<h3>Первая космическая скорость</h3><p>Спутник на круговой орбите: сила тяготения сообщает центростремительное ускорение: ${F('mv<sup>2</sup>', 'r')} = G${F('Mm', 'r<sup>2</sup>')} ⇒ v = ${R('GM/r')}. У поверхности Земли ≈ 7,9 км/с.</p>`,
    sum: ['F = Gm₁m₂/r²', 'r × k ⇒ F : k²', 'g = GM/R²', 'Орбитальная скорость v = √(GM/r)'],
    f: [['Закон всемирного тяготения', `F = G${F('m<sub>1</sub>m<sub>2</sub>', 'r<sup>2</sup>')}`], ['Ускорение свободного падения', `g = G${F('M', 'R<sup>2</sup>')}`], ['Орбитальная скорость', `v = ${R('GM/r')}`], ['Сила тяжести', 'F = mg']],
    defs: [['Гравитационная постоянная', 'G = 6,67·10⁻¹¹ Н·м²/кг²']],
    ex: [['Расстояние между телами увеличили в 3 раза. Как изменилась сила притяжения?', 'Уменьшилась в 9 раз.']],
    err: ['Забывают квадрат расстояния', 'Расстояние считают от поверхности, а не от центра'], gens: ['p_grav', 'p_weight'], viz: null, lab: 'fall', ege: 'Механика' });

  T({ id: 'p11', title: 'Сила трения', short: 'Трение покоя и скольжения, коэффициент трения, наклонная плоскость',
    theory: `<h3>Природа трения</h3><p>Трение возникает при соприкосновении поверхностей из-за неровностей и межмолекулярного притяжения.</p>
<h3>Трение покоя</h3><p>Пока тело не скользит, сила трения покоя <b>равна</b> внешней силе, которая пытается сдвинуть тело, и может расти до максимального значения μN.</p>
<h3>Трение скольжения</h3><p>F<sub>тр</sub> = μN, где μ — коэффициент трения (безразмерный), N — сила нормальной реакции опоры. На горизонтали без других вертикальных сил N = mg.</p>
<h3>Наклонная плоскость</h3><p>Силы: mg, N, F<sub>тр</sub>. Оси: вдоль плоскости и перпендикулярно.</p><p>N = mg cos α; скатывающая составляющая mg sin α. Если tg α ≤ μ — брусок покоится (трение покоя mg sin α). Иначе он скользит вниз с ускорением a = g(sin α − μ cos α).</p>
<div class="note">Откройте лабораторию «Наклонная плоскость» и найдите угол, при котором брусок начинает скользить: tg α = μ.</div>`,
    sum: ['Покой: Fтр = внешней силе ≤ μN', 'Скольжение: Fтр = μN', 'Наклон: N = mg cos α', 'a = g(sin α − μ cos α) при tg α > μ', 'Fтр всегда против относительной скорости'],
    f: [['Сила трения скольжения', 'F<sub>тр</sub> = μN'], ['Реакция на наклонной', 'N = mg cos α'], ['Ускорение вниз по наклонной', 'a = g(sin α − μ cos α)'], ['Условие покоя', 'tg α ≤ μ']],
    defs: [['Коэффициент трения', 'безразмерная величина, зависящая от материалов и состояния поверхностей']],
    ex: [['Брусок 2 кг тянут по столу равномерно, μ = 0,3. Сила тяги?', 'F = μmg = 0,3·2·10 = 6 Н.']],
    err: ['Считают трение покоя всегда равным μN', 'На наклонной пишут N = mg'], gens: ['p_fric', 'p_incl'], viz: null, lab: 'incline', ege: 'Механика' });

  T({ id: 'p12', title: 'Сила упругости', short: 'Закон Гука, жёсткость, соединения пружин',
    theory: `<h3>Деформация</h3><p>Изменение формы или размеров тела. <b>Упругая</b> деформация исчезает после снятия нагрузки.</p>
<h3>Закон Гука</h3><p>При малых упругих деформациях F<sub>упр</sub> = k|x|, где x — удлинение (м), k — жёсткость (Н/м). Сила упругости направлена против деформации.</p>
<h3>Соединения пружин</h3><p>Параллельно: k = k₁ + k₂. Последовательно: ${F(1, 'k')} = ${F(1, 'k<sub>1</sub>')} + ${F(1, 'k<sub>2</sub>')}.</p>
<h3>Энергия пружины</h3><p>E = ${F('kx<sup>2</sup>', 2)} — площадь под графиком F(x).</p>`,
    sum: ['F = kx (x в метрах!)', 'Параллельно: k = k₁ + k₂', 'Последовательно: 1/k = 1/k₁ + 1/k₂', 'E = kx²/2'],
    f: [['Закон Гука', 'F = k|x|'], ['Энергия пружины', `E = ${F('kx<sup>2</sup>', 2)}`], ['Последовательное соединение', `${F(1, 'k')} = ${F(1, 'k<sub>1</sub>')} + ${F(1, 'k<sub>2</sub>')}`]],
    defs: [['Жёсткость', 'коэффициент пропорциональности между силой упругости и удлинением']],
    ex: [['k = 200 Н/м, x = 5 см. Сила?', '200·0,05 = 10 Н.']],
    err: ['Подставляют сантиметры вместо метров', 'Путают формулы соединений'], gens: ['p_hooke'], viz: null, ege: 'Механика' });

  T({ id: 'p13', title: 'Статика', short: 'Равновесие, момент силы, рычаг',
    theory: `<h3>Условия равновесия</h3><ol><li>Векторная сумма сил равна нулю (нет поступательного ускорения).</li><li>Сумма моментов сил относительно любой оси равна нулю (нет вращения).</li></ol>
<h3>Момент силы</h3><p>M = F·d, где d — <b>плечо</b>: кратчайшее расстояние от оси до линии действия силы. Моменты, вращающие по часовой стрелке, берут с одним знаком, против — с другим.</p>
<h3>Правило рычага</h3><p>F₁d₁ = F₂d₂: выигрыш в силе равен отношению плеч. «Золотое правило механики»: выигрывая в силе, проигрываем в расстоянии.</p>`,
    sum: ['ΣF = 0 и ΣM = 0', 'M = F·d, d — плечо', 'Рычаг: F₁d₁ = F₂d₂'],
    f: [['Момент силы', 'M = F·d'], ['Правило рычага', 'F<sub>1</sub>d<sub>1</sub> = F<sub>2</sub>d<sub>2</sub>']],
    defs: [['Плечо силы', 'расстояние от оси вращения до линии действия силы']],
    ex: [['Груз 60 Н на плече 0,2 м. Какую силу приложить на плече 0,6 м?', 'F = 60·0,2/0,6 = 20 Н.']],
    err: ['Плечо считают до точки приложения, а не до линии действия'], gens: ['p_lever'], viz: null, ege: 'Механика' });

  T({ id: 'p14', title: 'Законы сохранения', short: 'Сохранение импульса и энергии — общая картина',
    theory: `<h3>Замкнутая система</h3><p>Система тел, на которую не действуют внешние силы (или они скомпенсированы). В ней сохраняются суммарный импульс и (при отсутствии трения) механическая энергия.</p>
<h3>Закон сохранения импульса</h3><p>m₁v⃗₁ + m₂v⃗₂ = m₁v⃗₁′ + m₂v⃗₂′. Работает при любых взаимодействиях, даже неупругих.</p>
<h3>Закон сохранения энергии</h3><p>E<sub>к</sub> + E<sub>п</sub> = const, если действуют только консервативные силы (тяжести, упругости). При трении часть механической энергии переходит во внутреннюю: E<sub>1</sub> = E<sub>2</sub> + Q.</p>
<h3>Когда что применять</h3><ul><li>Удар, взрыв, сцепление — импульс.</li><li>Подъём, падение, пружина — энергия.</li><li>Неупругий удар — импульс сохраняется, механическая энергия — нет.</li></ul>`,
    sum: ['Импульс сохраняется в замкнутой системе всегда', 'Мех. энергия сохраняется без трения и неупругих ударов', 'Падение с высоты h: v = √(2gh)', 'Неупругий удар: импульс — да, энергия — нет'],
    f: [['Сохранение импульса', 'Σm<sub>i</sub>v⃗<sub>i</sub> = const'], ['Сохранение энергии', 'E<sub>к</sub> + E<sub>п</sub> = const'], ['Скорость после падения', `v = ${R('2gh')}`]],
    defs: [['Замкнутая система', 'система тел, на которую не действуют внешние силы']],
    ex: [['С какой скоростью упадёт тело с высоты 20 м?', 'v = √(2·10·20) = 20 м/с.']],
    err: ['Применяют сохранение механической энергии к неупругому удару'], gens: ['p_drop'], viz: null, lab: 'collide', ege: 'Механика' });

  T({ id: 'p15', title: 'Работа и мощность', short: 'Механическая работа, мощность, КПД',
    theory: `<h3>Работа силы</h3><p>A = F·s·cos α, где α — угол между силой и перемещением. Работа положительна при α &lt; 90°, равна нулю при α = 90° (сила реакции опоры при горизонтальном движении работы не совершает), отрицательна при α &gt; 90° (сила трения).</p>
<h3>Мощность</h3><p>N = ${F('A', 't')} — работа в единицу времени (Вт). При равномерном движении N = F·v.</p>
<h3>КПД</h3><p>η = ${F('A<sub>полезн</sub>', 'A<sub>затр</sub>')}·100% &lt; 100%.</p>`,
    sum: ['A = Fs cos α', 'Сила ⟂ перемещению — работа 0', 'N = A/t = Fv', 'η = Aпол/Aзатр'],
    f: [['Работа', 'A = Fs cos α'], ['Мощность', `N = ${F('A', 't')} = Fv`], ['КПД', `η = ${F('A<sub>п</sub>', 'A<sub>з</sub>')}`]],
    defs: [['Механическая работа', 'скалярная величина, равная произведению модуля силы на перемещение и косинус угла между ними']],
    ex: [['Груз 50 кг подняли на 4 м за 10 с. Мощность?', 'A = mgh = 2000 Дж, N = 200 Вт.']],
    err: ['Забывают cos α', 'Считают, что сила тяжести не совершает работу при подъёме'], gens: ['p_work', 'p_power'], viz: null, ege: 'Механика' });

  T({ id: 'p16', title: 'Энергия', short: 'Кинетическая и потенциальная энергия, теорема о кинетической энергии',
    theory: `<h3>Кинетическая энергия</h3><p>Энергия движения: E<sub>к</sub> = ${F('mv<sup>2</sup>', 2)}. <b>Теорема:</b> работа равнодействующей равна изменению кинетической энергии: A = E<sub>к2</sub> − E<sub>к1</sub>.</p>
<h3>Потенциальная энергия</h3><p>Энергия взаимодействия: в поле тяжести E<sub>п</sub> = mgh (h отсчитывается от выбранного нулевого уровня); упругой пружины — ${F('kx<sup>2</sup>', 2)}.</p>
<h3>Полная механическая энергия</h3><p>E = E<sub>к</sub> + E<sub>п</sub>. Пример: мяч, брошенный вверх, теряет кинетическую энергию и набирает потенциальную; в верхней точке E<sub>к</sub> = 0 (если бросок вертикальный).</p>`,
    sum: ['Eк = mv²/2', 'Eп = mgh; пружина kx²/2', 'A = ΔEк', 'v×2 ⇒ Eк×4'],
    f: [['Кинетическая энергия', `E<sub>к</sub> = ${F('mv<sup>2</sup>', 2)}`], ['Потенциальная (тяжесть)', 'E<sub>п</sub> = mgh'], ['Теорема о кинетической энергии', 'A = ΔE<sub>к</sub>']],
    defs: [['Энергия', 'физическая величина, характеризующая способность тела совершить работу']],
    ex: [['m = 2 кг, v = 3 м/с. Eк?', '2·9/2 = 9 Дж.']],
    err: ['Забывают квадрат скорости', 'Не выбирают нулевой уровень'], gens: ['p_kin', 'p_epot'], viz: null, ege: 'Механика' });

  T({ id: 'p17', title: 'Импульс', short: 'Импульс тела, импульс силы, удары',
    theory: `<h3>Импульс</h3><p>p⃗ = mv⃗ (кг·м/с) — вектор, направленный как скорость.</p>
<h3>Импульс силы</h3><p>Из второго закона: F⃗Δt = Δp⃗. Чем дольше удар, тем меньше сила при том же изменении импульса — так работают подушки безопасности.</p>
<h3>Удары</h3><p><b>Абсолютно неупругий</b>: тела движутся вместе: v = ${F('m<sub>1</sub>v<sub>1</sub> + m<sub>2</sub>v<sub>2</sub>', 'm<sub>1</sub> + m<sub>2</sub>')} (с учётом знаков проекций). <b>Абсолютно упругий</b>: сохраняются импульс и кинетическая энергия.</p>
<p>Реактивное движение: ракета отбрасывает газ назад и получает импульс вперёд.</p>`,
    sum: ['p = mv, вектор', 'FΔt = Δp', 'Неупругий: v = (m₁v₁ + m₂v₂)/(m₁ + m₂)', 'Знаки проекций обязательны!'],
    f: [['Импульс', 'p⃗ = mv⃗'], ['Импульс силы', 'F⃗Δt = Δp⃗'], ['Неупругий удар', `v = ${F('m<sub>1</sub>v<sub>1</sub>+m<sub>2</sub>v<sub>2</sub>', 'm<sub>1</sub>+m<sub>2</sub>')}`]],
    defs: [['Импульс тела', 'произведение массы тела на его скорость']],
    ex: [['Тележка 2 кг (3 м/с) сцепляется с покоящейся 1 кг. Скорость?', '6/3 = 2 м/с.']],
    err: ['Не учитывают направление (знак) скоростей', 'Ищут Δp как разность модулей'], gens: ['p_inel', 'p_imp'], viz: null, lab: 'collide', ege: 'Механика' });

  T({ id: 'p18', title: 'Механические колебания', short: 'Период, частота, маятники, гармонические колебания',
    theory: `<h3>Колебания</h3><p>Движения, повторяющиеся через равные промежутки времени. <b>Период</b> T — время одного колебания: T = t/N. <b>Частота</b> ν = 1/T (Гц). <b>Амплитуда</b> A — наибольшее отклонение. Циклическая частота ω = 2πν.</p>
<h3>Гармонические колебания</h3><p>x = A cos(ωt + φ₀). Скорость максимальна в положении равновесия: v<sub>max</sub> = Aω.</p>
<h3>Маятники</h3><p>Математический: T = 2π${R('l/g')} — не зависит от массы и (при малых углах) от амплитуды. Пружинный: T = 2π${R('m/k')}.</p>
<h3>Энергия</h3><p>При колебаниях энергия переходит из кинетической в потенциальную и обратно; без трения полная энергия постоянна: ${F('kA<sup>2</sup>', 2)} = ${F('mv<sub>max</sub><sup>2</sup>', 2)}.</p>`,
    sum: ['T = t/N; ν = 1/T; ω = 2πν', 'x = A cos(ωt + φ₀)', 'Мат. маятник: T = 2π√(l/g)', 'Пружинный: T = 2π√(m/k)', 'l×4 ⇒ T×2'],
    f: [['Период', `T = ${F('t', 'N')}`], ['Частота', `ν = ${F(1, 'T')}`], ['Математический маятник', `T = 2π${R('l/g')}`], ['Пружинный маятник', `T = 2π${R('m/k')}`], ['Гармонические колебания', 'x = A cos(ωt + φ<sub>0</sub>)']],
    defs: [['Период', 'время одного полного колебания'], ['Амплитуда', 'наибольшее отклонение от положения равновесия']],
    ex: [['Маятник совершил 30 колебаний за 15 с. T и ν?', 'T = 0,5 с, ν = 2 Гц.']],
    err: ['Считают, что период мат. маятника зависит от массы', 'Путают T и ν'], gens: ['p_period', 'p_pend'], viz: null, lab: 'pendulum', ege: 'Механика' });

  T({ id: 'p19', title: 'Волны', short: 'Механические волны, длина волны, звук',
    theory: `<h3>Волна</h3><p>Распространение колебаний в пространстве. Волна переносит <b>энергию</b>, но не вещество: частицы среды колеблются около своих мест.</p>
<p><b>Поперечные</b> — колебания перпендикулярны направлению распространения (волна на верёвке). <b>Продольные</b> — вдоль (звук в воздухе).</p>
<h3>Длина волны</h3><p>λ — расстояние, которое волна проходит за один период; расстояние между соседними гребнями. v = λν = ${F('λ', 'T')}.</p>
<p>При переходе в другую среду <b>частота не меняется</b>, меняются скорость и длина волны.</p>
<h3>Звук</h3><p>Продольная волна с частотами 16 Гц — 20 кГц. Скорость в воздухе ≈ 340 м/с. Эхо: расстояние до препятствия s = ${F('vt', 2)} (звук проходит путь туда и обратно).</p>`,
    sum: ['v = λν = λ/T', 'Волна переносит энергию, не вещество', 'Смена среды: ν постоянна', 'Эхо: s = vt/2'],
    f: [['Скорость волны', 'v = λν'], ['Через период', `v = ${F('λ', 'T')}`], ['Эхо', `s = ${F('vt', 2)}`]],
    defs: [['Длина волны', 'расстояние между ближайшими точками, колеблющимися в одинаковой фазе']],
    ex: [['ν = 680 Гц, v = 340 м/с. λ?', '0,5 м.']],
    err: ['В задачах на эхо забывают делить на 2', 'Считают, что частота меняется при переходе в другую среду'], gens: ['p_wave', 'p_echo'], viz: null, lab: 'waves', ege: 'Механика' });

  T({ id: 'p20', title: 'Молекулярная физика', short: 'МКТ, количество вещества, идеальный газ, уравнение состояния',
    theory: `<h3>Основные положения МКТ</h3><ol><li>Вещество состоит из частиц (молекул, атомов).</li><li>Частицы непрерывно хаотически движутся (броуновское движение, диффузия).</li><li>Частицы взаимодействуют (притягиваются и отталкиваются).</li></ol>
<h3>Количество вещества</h3><p>ν = ${F('m', 'M')} = ${F('N', 'N<sub>A</sub>')}, N<sub>A</sub> = 6,02·10²³ моль⁻¹. Молярная масса M (кг/моль) = относительная молекулярная масса · 10⁻³: для O₂ M = 0,032 кг/моль.</p>
<h3>Температура</h3><p>Абсолютная температура T = t + 273 (К). Средняя кинетическая энергия молекул: E = ${F(3, 2)}kT, k = 1,38·10⁻²³ Дж/К.</p>
<h3>Уравнение Менделеева — Клапейрона</h3><p>pV = νRT, R = 8,31 Дж/(моль·К).</p><p>Изопроцессы (ν = const): изотермический pV = const; изобарный V/T = const; изохорный p/T = const.</p>`,
    sum: ['ν = m/M = N/Nₐ', 'T = t + 273', 'E = 3/2 kT', 'pV = νRT', 'T = const: pV = const; p = const: V/T = const; V = const: p/T = const'],
    f: [['Количество вещества', `ν = ${F('m', 'M')} = ${F('N', 'N<sub>A</sub>')}`], ['Уравнение Менделеева — Клапейрона', 'pV = νRT'], ['Средняя кинетическая энергия', `E = ${F(3, 2)}kT`], ['Основное уравнение МКТ', `p = ${F(1, 3)}m<sub>0</sub>nv<sup>2</sup>`], ['Абсолютная температура', 'T = t + 273']],
    defs: [['Идеальный газ', 'модель газа, молекулы которого не взаимодействуют на расстоянии и сталкиваются упруго'], ['Моль', 'количество вещества, содержащее Nₐ частиц']],
    ex: [['Газ изотермически сжали от 6 л до 2 л при p₁ = 100 кПа. p₂?', 'p₂ = p₁V₁/V₂ = 300 кПа.']],
    err: ['Подставляют температуру в °C', 'Молярную массу в г/моль'], gens: ['p_moles', 'p_iso', 'p_ekin_T'], viz: null, lab: 'gas', ege: 'МКТ и термодинамика' });

  T({ id: 'p21', title: 'Термодинамика', short: 'Внутренняя энергия, количество теплоты, первый закон, КПД',
    theory: `<h3>Внутренняя энергия</h3><p>Суммарная энергия движения и взаимодействия частиц. Для одноатомного идеального газа U = ${F(3, 2)}νRT.</p>
<h3>Способы изменения</h3><p>Работа и теплопередача. Количество теплоты: нагревание Q = cmΔt; плавление Q = λm; парообразование Q = Lm; сгорание Q = qm.</p>
<h3>Первый закон термодинамики</h3><div class="def"><b>Закон.</b> Q = ΔU + A — теплота идёт на изменение внутренней энергии и работу газа.</div><p>Работа газа при p = const: A = pΔV; на графике p(V) — площадь под кривой.</p>
<h3>Тепловые двигатели</h3><p>КПД η = ${F('A', 'Q<sub>н</sub>')} = ${F('Q<sub>н</sub> − Q<sub>х</sub>', 'Q<sub>н</sub>')}. Максимальный КПД (цикл Карно): η = 1 − ${F('T<sub>х</sub>', 'T<sub>н</sub>')}.</p>`,
    sum: ['Q = cmΔt', 'Q = ΔU + A', 'A = pΔV (p = const)', 'U = 3/2 νRT (одноатомный)', 'η = 1 − Tх/Tн (Карно)'],
    f: [['Нагревание', 'Q = cmΔt'], ['Плавление', 'Q = λm'], ['Парообразование', 'Q = Lm'], ['Первый закон термодинамики', 'Q = ΔU + A'], ['Работа газа (p = const)', 'A = pΔV'], ['Внутренняя энергия одноатомного газа', `U = ${F(3, 2)}νRT`], ['КПД Карно', `η = 1 − ${F('T<sub>х</sub>', 'T<sub>н</sub>')}`]],
    defs: [['Удельная теплоёмкость', 'количество теплоты для нагревания 1 кг вещества на 1 К']],
    ex: [['Нагреватель 527 °C, холодильник 127 °C. КПД Карно?', 'Tн = 800 К, Tх = 400 К ⇒ η = 50%.']],
    err: ['Подставляют °C в формулу КПД', 'Знак работы над газом и работы газа'], gens: ['p_heat', 'p_first', 'p_carnot'], viz: null, ege: 'МКТ и термодинамика' });

  T({ id: 'p22', title: 'Электростатика', short: 'Заряд, закон Кулона, поле, потенциал, конденсатор',
    theory: `<h3>Электрический заряд</h3><p>Бывает положительный и отрицательный; одноимённые отталкиваются, разноимённые притягиваются. Заряд дискретен: q = Ne, e = 1,6·10⁻¹⁹ Кл. В замкнутой системе сумма зарядов сохраняется.</p>
<h3>Закон Кулона</h3><p>F = k${F('|q<sub>1</sub>||q<sub>2</sub>|', 'r<sup>2</sup>')}, k = 9·10⁹ Н·м²/Кл².</p>
<h3>Электрическое поле</h3><p>Напряжённость E = ${F('F', 'q')} (Н/Кл = В/м). Поле точечного заряда E = k${F('|q|', 'r<sup>2</sup>')}. Потенциал φ = ${F('W', 'q')}; напряжение U = φ₁ − φ₂; в однородном поле U = Ed.</p>
<h3>Конденсатор</h3><p>C = ${F('q', 'U')} (Ф). Плоский: C = ${F('εε<sub>0</sub>S', 'd')}. Энергия W = ${F('CU<sup>2</sup>', 2)} = ${F('q<sup>2</sup>', '2C')}.</p>`,
    sum: ['F = k|q₁||q₂|/r²', 'E = F/q', 'U = Ed (однородное поле)', 'C = q/U; плоский: C = εε₀S/d', 'W = CU²/2'],
    f: [['Закон Кулона', `F = k${F('|q<sub>1</sub>||q<sub>2</sub>|', 'r<sup>2</sup>')}`], ['Напряжённость', `E = ${F('F', 'q')}`], ['Поле точечного заряда', `E = k${F('|q|', 'r<sup>2</sup>')}`], ['Напряжение в однородном поле', 'U = Ed'], ['Ёмкость', `C = ${F('q', 'U')}`], ['Плоский конденсатор', `C = ${F('εε<sub>0</sub>S', 'd')}`], ['Энергия конденсатора', `W = ${F('CU<sup>2</sup>', 2)}`]],
    defs: [['Элементарный заряд', 'e = 1,6·10⁻¹⁹ Кл'], ['Напряжённость поля', 'сила, действующая на единичный положительный пробный заряд']],
    ex: [['Расстояние между зарядами уменьшили в 2 раза. Сила?', 'Увеличилась в 4 раза.']],
    err: ['Забывают квадрат r', 'Путают потенциал и напряжённость'], gens: ['p_coul', 'p_cap'], viz: null, ege: 'Электродинамика' });

  T({ id: 'p23', title: 'Постоянный электрический ток', short: 'Сила тока, закон Ома, работа и мощность тока',
    theory: `<h3>Электрический ток</h3><p>Упорядоченное движение заряженных частиц. Сила тока I = ${F('q', 't')} (А). За направление тока принято направление движения положительных зарядов.</p>
<h3>Сопротивление</h3><p>R = ρ${F('l', 'S')}, где ρ — удельное сопротивление. Чем длиннее и тоньше проводник, тем больше сопротивление.</p>
<h3>Закон Ома для участка цепи</h3><div class="def"><b>Закон.</b> I = ${F('U', 'R')}: сила тока прямо пропорциональна напряжению и обратно пропорциональна сопротивлению.</div>
<h3>Работа и мощность тока</h3><p>A = UIt; P = UI = I<sup>2</sup>R = ${F('U<sup>2</sup>', 'R')}. Закон Джоуля — Ленца: Q = I<sup>2</sup>Rt.</p>
<h3>ЭДС и полная цепь</h3><p>Источник характеризуется ЭДС ε и внутренним сопротивлением r: I = ${F('ε', 'R + r')}. Ток короткого замыкания I<sub>кз</sub> = ε/r.</p>`,
    sum: ['I = q/t', 'I = U/R', 'R = ρl/S', 'P = UI = I²R = U²/R', 'Q = I²Rt', 'I = ε/(R + r)'],
    f: [['Сила тока', `I = ${F('q', 't')}`], ['Закон Ома для участка', `I = ${F('U', 'R')}`], ['Сопротивление проводника', `R = ρ${F('l', 'S')}`], ['Мощность тока', `P = UI = I<sup>2</sup>R = ${F('U<sup>2</sup>', 'R')}`], ['Закон Джоуля — Ленца', 'Q = I<sup>2</sup>Rt'], ['Закон Ома для полной цепи', `I = ${F('ε', 'R+r')}`]],
    defs: [['Сила тока', 'заряд, проходящий через поперечное сечение проводника в единицу времени'], ['ЭДС', 'работа сторонних сил по перемещению единичного заряда внутри источника']],
    ex: [['U = 12 В, R = 4 Ом. I и P?', 'I = 3 А, P = 36 Вт.']],
    err: ['Путают формулы мощности при разных соединениях', 'Забывают внутреннее сопротивление'], gens: ['p_ohm', 'p_pel', 'p_emf'], viz: null, lab: 'ohm', ege: 'Электродинамика' });

  T({ id: 'p24', title: 'Электрические цепи', short: 'Последовательное и параллельное соединение, приборы',
    theory: `<h3>Последовательное соединение</h3><p>Ток одинаков: I = I₁ = I₂; напряжения складываются: U = U₁ + U₂; R = R₁ + R₂.</p>
<h3>Параллельное соединение</h3><p>Напряжение одинаково: U = U₁ = U₂; токи складываются: I = I₁ + I₂; ${F(1, 'R')} = ${F(1, 'R<sub>1</sub>')} + ${F(1, 'R<sub>2</sub>')}; для двух: R = ${F('R<sub>1</sub>R<sub>2</sub>', 'R<sub>1</sub>+R<sub>2</sub>')}. Общее сопротивление меньше наименьшего.</p>
<h3>Приборы</h3><p>Амперметр включают последовательно (у идеального R = 0), вольтметр — параллельно (у идеального R = ∞).</p>
<h3>Алгоритм для смешанной цепи</h3><ol><li>Найдите простые последовательные/параллельные группы.</li><li>Заменяйте их эквивалентными сопротивлениями.</li><li>Найдите общий ток, затем возвращайтесь к исходной схеме.</li></ol>`,
    sum: ['Последовательно: I одинаков, R = R₁ + R₂', 'Параллельно: U одинаково, 1/R = 1/R₁ + 1/R₂', 'Две равные R параллельно: R/2', 'Амперметр — последовательно, вольтметр — параллельно'],
    f: [['Последовательно', 'R = R<sub>1</sub> + R<sub>2</sub>'], ['Параллельно', `${F(1, 'R')} = ${F(1, 'R<sub>1</sub>')} + ${F(1, 'R<sub>2</sub>')}`], ['Два резистора параллельно', `R = ${F('R<sub>1</sub>R<sub>2</sub>', 'R<sub>1</sub>+R<sub>2</sub>')}`]],
    defs: [['Узел', 'точка цепи, где соединяются три и более проводника']],
    ex: [['6 Ом и 3 Ом параллельно, последовательно с 4 Ом. R?', '6·3/9 = 2; 2 + 4 = 6 Ом.']],
    err: ['Складывают сопротивления при параллельном соединении', 'Включают вольтметр последовательно'], gens: ['p_circ'], viz: null, lab: 'circuit', ege: 'Электродинамика' });

  T({ id: 'p25', title: 'Магнитное поле', short: 'Индукция, сила Ампера, сила Лоренца',
    theory: `<h3>Магнитное поле</h3><p>Создаётся движущимися зарядами (токами) и действует на движущиеся заряды. Характеристика — <b>магнитная индукция</b> B (Тл). Линии индукции замкнуты.</p>
<h3>Правило буравчика</h3><p>Если буравчик вкручивать по направлению тока, направление вращения ручки покажет направление линий магнитной индукции.</p>
<h3>Сила Ампера</h3><p>На проводник с током: F = BIl sin α. Направление — по <b>правилу левой руки</b>: линии B входят в ладонь, четыре пальца по току, отогнутый большой палец — сила.</p>
<h3>Сила Лоренца</h3><p>На заряд: F = |q|vB sin α. Она перпендикулярна скорости, поэтому работы не совершает и меняет только направление. При v ⟂ B заряд движется по окружности радиуса r = ${F('mv', '|q|B')}, период T = ${F('2πm', '|q|B')}.</p>`,
    sum: ['F_A = BIl sin α', 'F_Л = |q|vB sin α', 'Левая рука: B в ладонь, пальцы по току', 'r = mv/(|q|B)', 'Сила Лоренца работы не совершает'],
    f: [['Сила Ампера', 'F = BIl sin α'], ['Сила Лоренца', 'F = |q|vB sin α'], ['Радиус орбиты', `r = ${F('mv', '|q|B')}`], ['Период обращения', `T = ${F('2πm', '|q|B')}`]],
    defs: [['Магнитная индукция', 'векторная силовая характеристика магнитного поля']],
    ex: [['B = 0,5 Тл, I = 4 А, l = 0,2 м, α = 90°. F?', '0,5·4·0,2 = 0,4 Н.']],
    err: ['Для отрицательного заряда не меняют направление силы', 'Забывают sin α'], gens: ['p_ampere', 'p_lorentz'], viz: null, ege: 'Электродинамика' });

  T({ id: 'p26', title: 'Электромагнитная индукция', short: 'Магнитный поток, закон Фарадея, правило Ленца, самоиндукция',
    theory: `<h3>Магнитный поток</h3><p>Φ = BS cos α (Вб), α — угол между B и нормалью к контуру.</p>

    { id: 'f23', subj: 'phys', num: 23, max: 2, topic: 'p21', q: '2 моль одноатомного идеального газа нагревают при постоянном давлении на 50 К. Какое количество теплоты получил газ? R = 8,31 Дж/(моль·К).',
      sol: 'Первый закон: Q = ΔU + A. ΔU = 3/2·νRΔT, A = pΔV = νRΔT (p = const).<br>Q = 5/2·νRΔT = 2,5·2·8,31·50 = 2077,5 Дж ≈ 2,1 кДж.<br><b>Ответ:</b> ≈ 2,1 кДж.',

    { id: 'f24', subj: 'phys', num: 24, max: 3, topic: 'p17', q: 'Брусок массой 0,5 кг соскальзывает без трения с горки высотой 1,8 м и на горизонтальной поверхности сталкивается с покоящимся бруском массой 1 кг. После удара бруски движутся вместе. Найдите скорость брусков после удара и количество теплоты, выделившееся при ударе. g = 10 м/с².',

    { id: 'f25', subj: 'phys', num: 25, max: 3, topic: 'p24', q: 'Источник с ЭДС 12 В и внутренним сопротивлением 1 Ом подключён к двум параллельно соединённым резисторам 6 Ом и 3 Ом. Найдите мощность, выделяющуюся на резисторе 6 Ом.',

<script>
/* ПРОЕКТ 200 — визуализации: SVG-чертежи к задачам и интерактивные модели тем */
'use strict';
(function () {
  const C = { ink: '#231a14', red: '#b3261e', gold: '#b8954a', grid: '#e4d8bd', ax: '#5a3d2b', blue: '#2b5d8a', green: '#2f6b3a' };
  const svg = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,DejaVu Sans,sans-serif" font-size="13">${body}</svg>`;
  const arrowDef = (id, col) => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker></defs>`;
  const fx = x => P.fmt(x);
  const V = P.V = {};

  /* координатная плоскость с графиками */
  V.plot = function ({ fns = [], pts = [], range = 6, size = 300 }) {
    const s = size / (2 * range), X = x => size / 2 + x * s, Y = y => size / 2 - y * s;
    let b = '';
    for (let i = -range; i <= range; i++) b += `<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="${size}" stroke="${C.grid}"/><line x1="0" y1="${Y(i)}" x2="${size}" y2="${Y(i)}" stroke="${C.grid}"/>`;
    b += arrowDef('ax', C.ax) + `<line x1="0" y1="${Y(0)}" x2="${size - 2}" y2="${Y(0)}" stroke="${C.ax}" stroke-width="1.5" marker-end="url(#ax)"/><line x1="${X(0)}" y1="${size}" x2="${X(0)}" y2="2" stroke="${C.ax}" stroke-width="1.5" marker-end="url(#ax)"/>`;
    b += `<text x="${size - 12}" y="${Y(0) - 6}">x</text><text x="${X(0) + 6}" y="12">y</text><text x="${X(1) - 3}" y="${Y(0) + 14}" font-size="11">1</text><text x="${X(0) - 12}" y="${Y(1) + 4}" font-size="11">1</text>`;
    fns.forEach((f, k) => {
      let d = '', pen = false;
      for (let px = 0; px <= size; px += 2) { const x = (px - size / 2) / s, y = f(x); if (!isFinite(y) || Math.abs(y) > range * 3) { pen = false; continue; } d += (pen ? 'L' : 'M') + px.toFixed(1) + ' ' + Y(y).toFixed(1); pen = true; }
      b += `<path d="${d}" fill="none" stroke="${k ? C.blue : C.red}" stroke-width="2.5"/>`;
    });
    pts.forEach(([x, y]) => { if (Math.abs(x) <= range && Math.abs(y) <= range) b += `<circle cx="${X(x)}" cy="${Y(y)}" r="4.5" fill="${C.ink}"/>`; });
    return svg(size, size, `<rect width="${size}" height="${size}" fill="#fffdf8"/>` + b);
  };
  V.rtri = function (a, b, la, lb, lc) {
    const k = 200 / Math.max(a, b), A = [30, 40 + b * k], B = [30 + a * k, 40 + b * k], Cc = [30, 40];
    const w = Math.max(260, B[0] + 50), h = A[1] + 30;
    return svg(w, h, `<polygon points="${A} ${B} ${Cc}" fill="#f6eedb" stroke="${C.ink}" stroke-width="2"/><rect x="30" y="${A[1] - 14}" width="14" height="14" fill="none" stroke="${C.ink}"/>
<text x="${(A[0] + B[0]) / 2}" y="${A[1] + 20}" text-anchor="middle">${la}</text><text x="12" y="${(A[1] + Cc[1]) / 2}" text-anchor="middle">${lb}</text><text x="${(B[0] + Cc[0]) / 2 + 14}" y="${(B[1] + Cc[1]) / 2 - 6}" fill="${C.red}">${lc}</text>`);
  };
  V.circ = function (ang) {
    const cx = 150, cy = 140, R = 100, a1 = -90 - ang / 2, a2 = -90 + ang / 2, p = d => [cx + R * Math.cos(d * Math.PI / 180), cy + R * Math.sin(d * Math.PI / 180)];
    const A = p(a1), B = p(a2), Cc = p(90 + (ang > 200 ? 0 : 20));
    return svg(300, 270, `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fffdf8" stroke="${C.ink}" stroke-width="2"/><polyline points="${A} ${cx},${cy} ${B}" fill="none" stroke="${C.blue}" stroke-width="2"/><polyline points="${A} ${Cc} ${B}" fill="none" stroke="${C.red}" stroke-width="2"/>
<circle cx="${cx}" cy="${cy}" r="3" fill="${C.ink}"/><text x="${cx + 6}" y="${cy + 14}">O</text><text x="${A[0] - 16}" y="${A[1] - 4}">A</text><text x="${B[0] + 6}" y="${B[1] - 4}">B</text><text x="${Cc[0] - 4}" y="${Cc[1] + 18}">C</text>`);
  };
  V.trap = function (a, b, h) {
    const k = 220 / b, off = (b - a) / 2 * k, H = Math.max(40, h * k);
    return svg(280, H + 50, `<polygon points="30,${H + 20} ${30 + b * k},${H + 20} ${30 + off + a * k},20 ${30 + off},20" fill="#f6eedb" stroke="${C.ink}" stroke-width="2"/><line x1="${30 + off}" y1="20" x2="${30 + off}" y2="${H + 20}" stroke="${C.red}" stroke-dasharray="4 3"/>
<text x="${30 + b * k / 2}" y="${H + 38}" text-anchor="middle">${b}</text><text x="${30 + off + a * k / 2}" y="14" text-anchor="middle">${a}</text><text x="${36 + off}" y="${H / 2 + 24}" fill="${C.red}">h</text><text x="44" y="${H + 14}" font-size="11">30°</text>`);
  };
  V.box = function (a, b, c, diag) {
    const m = Math.max(a, b, c), k = 120 / m, W = a * k, D = b * k * .5, H = c * k, x0 = 30, y0 = 40 + D + H;
    const P0 = [x0, y0], P1 = [x0 + W, y0], P2 = [x0 + W + D, y0 - D], P3 = [x0 + D, y0 - D], T = p => [p[0], p[1] - H];
    const l = (p, q, st = '') => `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${C.ink}" stroke-width="1.8" ${st}/>`;
    let s = l(P0, P1) + l(P1, P2) + l(P0, T(P0)) + l(P1, T(P1)) + l(P2, T(P2)) + l(T(P0), T(P1)) + l(T(P1), T(P2)) + l(T(P2), T(P3)) + l(T(P3), T(P0)) + l(P3, P0, 'stroke-dasharray="4 3"') + l(P3, P2, 'stroke-dasharray="4 3"') + l(P3, T(P3), 'stroke-dasharray="4 3"');
    if (diag) s += `<line x1="${P0[0]}" y1="${P0[1]}" x2="${T(P2)[0]}" y2="${T(P2)[1]}" stroke="${C.red}" stroke-width="2.2"/>`;
    s += `<text x="${x0 + W / 2}" y="${y0 + 18}" text-anchor="middle">${a}</text><text x="${P1[0] + D / 2 + 8}" y="${y0 - D / 2 + 12}">${b}</text><text x="${x0 - 16}" y="${y0 - H / 2}">${c}</text>`;
    return svg(Math.max(240, x0 + W + D + 30), y0 + 30, s);
  };
  V.vecs = function (vs, sum) {
    const all = vs.concat(sum ? [[vs[0][0] + vs[1][0], vs[0][1] + vs[1][1]]] : []), m = Math.max(4, ...all.map(v => Math.max(Math.abs(v[0]), Math.abs(v[1])))) + 1;
    const size = 280, s = size / (2 * m), X = x => size / 2 + x * s, Y = y => size / 2 - y * s; let b = arrowDef('va', C.red) + arrowDef('vb', C.blue) + arrowDef('vs', C.green);
    for (let i = -m; i <= m; i++) b += `<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="${size}" stroke="${C.grid}"/><line x1="0" y1="${Y(i)}" x2="${size}" y2="${Y(i)}" stroke="${C.grid}"/>`;
    b += `<line x1="0" y1="${Y(0)}" x2="${size}" y2="${Y(0)}" stroke="${C.ax}"/><line x1="${X(0)}" y1="0" x2="${X(0)}" y2="${size}" stroke="${C.ax}"/>`;
    const ar = (x0, y0, x, y, col, id, lab) => `<line x1="${X(x0)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y)}" stroke="${col}" stroke-width="2.5" marker-end="url(#${id})"/><text x="${X(x) + 5}" y="${Y(y) - 5}" fill="${col}" font-weight="700">${lab}</text>`;
    b += ar(0, 0, vs[0][0], vs[0][1], C.red, 'va', 'a') + ar(0, 0, vs[1][0], vs[1][1], C.blue, 'vb', 'b');
    if (sum) b += ar(0, 0, all[2][0], all[2][1], C.green, 'vs', 'a+b');
    return svg(size, size, `<rect width="${size}" height="${size}" fill="#fffdf8"/>` + b);

    const pr = S.profile, budget = pr.minutes || 40, items = [], used = () => items.reduce((a, i) => a + i.min, 0);

    const due = P.TOPICS.filter(t => { const s = tState(t.id); return s.read && s.next && s.next <= today(); }).sort((a, b) => tState(a.id).m - tState(b.id).m);

<div class="btns"><button class="btn ghost full" data-go="exam/theme/${id}">Контрольное испытание (8 задач, таймер)</button></div></div>
${ext.length ? `<div class="card"><h3>Задачи с развёрнутым решением</h3><p class="small muted">Эталонное решение и самооценка по критериям. ${P.EXT_NOTE}</p>${ext.map(e => `<button class="tap row" style="padding:10px 0;border-bottom:1px dashed var(--line)" data-ext="${e.id}"><span class="num">${e.num}</span><span class="grow small">${e.q.replace(/<[^>]+>/g, ' ').slice(0, 90)}…</span>›</button>`).join('')}</div>` : ''}`;
    } else if (tab === 'viz') {
      body = `<div class="card" id="vizc">${t.viz ? '' : ''}</div>${lab ? `<button class="btn sec full" data-go="lab/${lab.id}">Открыть лабораторию «${lab.title}» →</button>` : ''}`;
    }
    view.innerHTML = `<div class="seg">${tabs.map(([k, n]) => `<button class="${k === tab ? 'on' : ''}" data-go="topic/${id}/${k}">${n}</button>`).join('')}</div>` + body;
    const mr = $('#markRead'); if (mr) mr.onclick = async () => { await setTopic(id, { read: true, box: s.box || 0, next: P.addDays(today(), 1) }); await completePlan('lesson', id); P.snd.play('ok'); await checkProgress(); render(); };
    view.addEventListener('click', e => { const x = e.target.closest('[data-ext]'); if (x) extModal(P.EXT.find(q => q.id === x.dataset.ext)); });
    if (tab === 'viz') { const vc = $('#vizc'); if (t.viz) { P.VIZ[t.viz](vc); } else if (lab) { vc.innerHTML = '<div class="lab"></div>'; return lab.init(vc); } }
  });
  function extModal(e) {
    P.modal(`<div class="row"><h3 class="grow">Задание ${e.num} · до ${e.max} б.</h3><button class="chip" data-close>✕</button></div><div class="task"><p>${e.q}</p></div>
<textarea class="txtin" placeholder="Запишите ключевые шаги решения и ответ (необязательно)"></textarea>
<details class="sol"><summary>Эталонное решение</summary><div class="task"><p>${e.sol}</p></div></details>
<h3 style="margin-top:12px">Самооценка</h3><p class="small muted">${P.EXT_NOTE}</p><div class="opts">${e.crit.map(([p, txt]) => `<button class="opt" data-p="${p}"><span class="k">${p}</span><span>${txt}</span></button>`).join('')}</div>`, sh => {
      sh.addEventListener('click', async ev => { const o = ev.target.closest('[data-p]'); if (!o) return; const pts = +o.dataset.p; await P.recordAnswer({ topic: e.topic, subj: e.subj, gid: e.id }, { ok: pts === e.max, score: pts, max: e.max }, 'ext'); P.snd.play(pts === e.max ? 'ok' : 'term'); P.toast(`Самооценка записана: ${pts} из ${e.max}`); P.closeModal(); });
    });
  }

  /* ================= ВВОД ОТВЕТА / ЗАДАЧА ================= */
  const UNITS = ['м', 'см', 'км', 'с', 'мин', 'ч', 'кг', 'г', 'м/с', 'км/ч', 'м/с²', 'Н', 'Дж', 'кДж', 'Вт', 'Па', 'кг·м/с', 'А', 'В', 'Ом', 'Кл', 'Тл', 'Гц', 'К', 'моль', 'Н/м'];
  /* рендер задачи. opts: {exam:bool, saved, onAnswer(input), onResult(res)} */
  P.renderTask = function (box, t, opts = {}) {
    const fields = [];
    let html = `<div class="task"><div class="tq">${t.q}</div>${t.viz ? `<div class="vizbox">${t.viz}</div>` : ''}`;
    if (t.type === 'choice') html += `<div class="opts">${t.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${o}</span></button>`).join('')}</div>`;
    else if (t.type === 'match') html += `<div class="match"><div class="small">${t.right.map((x, i) => `<b>${i + 1})</b> ${x}`).join('&nbsp;&nbsp; ')}</div>${t.left.map((l, i) => `<div class="mrow"><span class="ml"><b>${'АБВГ'[i]})</b> ${l}</span><span class="mb" data-row="${i}">${t.right.map((_, j) => `<button data-j="${j}">${j + 1}</button>`).join('')}</span></div>`).join('')}</div>`;
    else if (t.type === 'ext') html += `<textarea class="txtin" placeholder="Запишите решение и ответ">${esc((opts.saved && opts.saved.text) || '')}</textarea><p class="small muted">После завершения варианта откроется эталонное решение и самооценка по критериям.</p>`;
    else {
      const specs = t.steps || [t];
      specs.forEach((sp, i) => { fields.push(sp); html += `<div class="stepi">${t.steps ? `<div class="lbl2">Шаг ${i + 1}. ${sp.q}${sp.unit && !sp.needUnit ? ' (' + sp.unit + ')' : ''}</div>` : ''}<div class="ansrow"><div class="ansf" data-f="${i}"><span class="ph">Ответ${!t.steps && sp.unit && !sp.needUnit ? ', ' + sp.unit : ''}</span></div>${sp.needUnit ? `<input class="unitf" data-u="${i}" placeholder="ед." autocomplete="off" autocapitalize="off" spellcheck="false">` : ''}</div></div>`; });
      if (specs.some(s => s.needUnit)) html += `<div class="chips small" style="margin-top:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch" id="uchips">${UNITS.map(u => `<button class="chip" data-unit="${u}">${u}</button>`).join('')}</div>`;
      html += `<div class="kp">${['7', '8', '9', '/', '⌫', '4', '5', '6', '−', '(', '1', '2', '3', ',', ')', '0', '√', 'π', '^', 'C'].map(k => `<button class="${/\d/.test(k) ? '' : k === '⌫' || k === 'C' ? 'del' : 'op'}" data-k="${k}">${k}</button>`).join('')}</div>`;
    }
    html += `</div>${opts.exam ? '' : `<button class="btn full" id="chk" style="margin-top:12px">Проверить</button>`}<div id="fb"></div>`;
    box.innerHTML = html;
    const vals = fields.map(() => ''), units = fields.map(() => ''); let cur = 0, choice = null, match = t.type === 'match' ? t.left.map(() => null) : null;
    const sv = opts.saved;
    if (sv) { if (t.type === 'choice') choice = sv; else if (t.type === 'match') match = sv.slice(); else if (t.type !== 'ext') { if (t.steps) { sv.steps.forEach((v, i) => vals[i] = v); (sv.units || []).forEach((v, i) => units[i] = v || ''); } else { vals[0] = sv.value || ''; units[0] = sv.unit || ''; } } }
    const input = () => t.type === 'choice' ? choice : t.type === 'match' ? match : t.type === 'ext' ? { text: box.querySelector('textarea').value, self: sv && sv.self } : t.steps ? { steps: vals.slice(), units: units.slice() } : { value: vals[0], unit: units[0] };
    const paint = () => {
      $$('.ansf', box).forEach((el, i) => { el.classList.toggle('focus', i === cur); el.innerHTML = vals[i] ? esc(vals[i]) + (i === cur ? '<span class="cur"></span>' : '') : (i === cur ? '<span class="cur"></span>' : '') + `<span class="ph">${t.steps ? '' : 'Ответ'}</span>`; });
      $$('[data-u]', box).forEach((el, i) => { if (el.value !== units[+el.dataset.u]) el.value = units[+el.dataset.u]; });
      $$('.opt', box).forEach((el, i) => el.classList.toggle('sel', i === choice));
      if (match) $$('.mb', box).forEach(row => $$('button', row).forEach(b => b.classList.toggle('on', match[+row.dataset.row] === +b.dataset.j)));
    };
    const changed = () => { paint(); if (opts.onAnswer) opts.onAnswer(input()); };
    box.addEventListener('click', e => {
      const k = e.target.closest('[data-k]'); if (k) { P.snd.play('key'); const v = k.dataset.k; if (v === '⌫') vals[cur] = vals[cur].slice(0, -1); else if (v === 'C') vals[cur] = ''; else if (vals[cur].length < 24) vals[cur] += v; changed(); return; }
      const f = e.target.closest('[data-f]'); if (f) { cur = +f.dataset.f; paint(); return; }
      const o = e.target.closest('.opt[data-i]'); if (o && !box.dataset.locked) { choice = +o.dataset.i; P.snd.play('toggle'); changed(); return; }
      const mb = e.target.closest('.mb button'); if (mb && !box.dataset.locked) { match[+mb.parentNode.dataset.row] = +mb.dataset.j; P.snd.play('toggle'); changed(); return; }
      const uc = e.target.closest('[data-unit]'); if (uc) { const i = fields[cur] && fields[cur].needUnit ? cur : fields.findIndex(s => s.needUnit); if (i >= 0) { units[i] = uc.dataset.unit; P.snd.play('toggle'); changed(); } return; }
    });
    $$('[data-u]', box).forEach(el => el.addEventListener('input', () => { units[+el.dataset.u] = el.value; if (opts.onAnswer) opts.onAnswer(input()); }));
    const ta = box.querySelector('textarea'); if (ta && opts.onAnswer) ta.addEventListener('input', () => opts.onAnswer(input()));
    const kd = e => { if (!fields.length || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; const m = { '-': '−', '.': ',', '*': '·' }; let ch = m[e.key] || e.key; if (/^[\d,−/()^]$/.test(ch) || ch === '·') { vals[cur] += ch === '·' ? '' : ch; changed(); } else if (e.key === 'Backspace') { vals[cur] = vals[cur].slice(0, -1); changed(); } else if (e.key === 'Enter' && $('#chk', box)) $('#chk', box).click(); };
    document.addEventListener('keydown', kd);
    paint();
    const chk = $('#chk', box);
    if (chk) chk.onclick = () => {
      const res = P.check(t, input());
      if (res.invalid) { P.toast(res.msg, 3200); P.snd.play('term'); return; }
      box.dataset.locked = 1; chk.remove(); P.snd.play(res.ok ? 'ok' : 'bad');
      if (t.type === 'choice') { $$('.opt', box).forEach((el, i) => { if (i === t.ans) el.classList.add('right'); else if (i === choice) el.classList.add('wrong'); }); }
      if (t.type === 'match') $$('.mb', box).forEach(row => { const ri = +row.dataset.row; $$('button', row).forEach(b => { const j = +b.dataset.j; if (j === t.ans[ri]) b.classList.add('right'); else if (j === match[ri]) b.classList.add('wrong'); }); });
      $('#fb', box).innerHTML = feedbackHTML(t, res);
      if (opts.onResult) opts.onResult(res);
    };
    return { input, destroy: () => document.removeEventListener('keydown', kd) };
  };
  function ansStr(t) {
    if (t.type === 'choice') return (t.ans + 1) + ') ' + t.opts[t.ans];
    if (t.type === 'match') return t.ans.map(x => x + 1).join('');
    if (t.steps) return t.steps.map((s, i) => `шаг ${i + 1}: ${fmt(s.a)}${s.unit ? ' ' + s.unit : ''}`).join('; ');

  }
  P.ansStr = ansStr;
  function feedbackHTML(t, res) {
    const sol = t.sol ? `<ol>${t.sol.map(s => `<li>${s}</li>`).join('')}</ol>` : `<p>${t.expl || ''}</p>`;
    if (res.ok) return `<div class="fb ok"><h4>✓ Верно${res.unitNote || ''}</h4>${t.type === 'match' || t.type === 'choice' ? `<p>${t.expl}</p>` : `<details class="sol"><summary>Эталонное решение</summary>${sol}</details>`}</div>`;
    return `<div class="fb bad"><h4>✗ Неверно${res.score ? ` (частично: ${res.score} из ${res.max})` : ''}</h4>
<p><b>1. Где ошибка.</b> ${res.where || 'Итоговый ответ'}.</p><p><b>2. Почему.</b> ${res.why || ''}</p><div><b>3. Как рассуждать.</b>${sol}</div><p><b>4. Верный ответ:</b> ${ansStr(t)}</p></div>`;
  }
  P.feedbackHTML = feedbackHTML;

  /* ================= ПРАКТИКА ================= */
  R('practice', (id, mode) => {
    let ids, title, subj;
    if (id === 'mix') { subj = mode; ids = TOP(subj).filter(t => tState(t.id).read || tState(t.id).att).map(t => t.id); if (!ids.length) ids = TOP(subj).slice(0, 3).map(t => t.id); title = 'Смешанная практика'; mode = 'long'; }
    else { const t = P.topicById(id); ids = [id]; title = t.title; subj = t.subj; }
    const N = mode === 'long' ? 10 : 5, gens = [];
    ids.forEach(tid => P.gensFor(tid).forEach(g => gens.push([g, tid])));
    if (!gens.length) { view.innerHTML = '<div class="card">Для этой темы нет задач.</div>'; return; }
    const rr = P.rng(P.seed()), order = rr.shuffle(gens), results = []; let i = 0, ctl = null;
    setTop(mode === 'review' ? 'Повторение' : 'Практика', title, true);
    const next = () => {
      if (ctl) ctl.destroy();
      if (i >= N) return finish();
      const [gid, tid] = order[i % order.length], task = P.makeTask(gid, P.seed(), { topic: tid });
      view.innerHTML = `<div class="progdots">${Array.from({ length: N }, (_, k) => `<i class="${k < results.length ? (results[k] ? 'ok' : 'bad') : k === i ? 'cur' : ''}"></i>`).join('')}</div><div class="card"><div class="row"><span class="badge">${esc(P.topicById(task.topic).title)}</span><span class="badge ${task.level >= 3 ? 'r' : ''}">${['', 'базовый', 'средний', 'повышенный'][task.level]}</span></div><div id="tb" style="margin-top:8px"></div></div><div id="nx"></div>`;
      ctl = P.renderTask($('#tb'), task, { onResult: async res => { results.push(!!res.ok); await P.recordAnswer(task, res); $('#nx').innerHTML = `<button class="btn full" id="nb">${i + 1 >= N ? 'Итоги' : 'Следующая задача →'}</button>`; $('#nb').onclick = () => { i++; next(); }; } });
    };
    const finish = async () => {
      const ok = results.filter(Boolean).length, pct = ok / N;
      if (id !== 'mix') { const s = tState(id), box = pct >= .8 ? Math.min(5, (s.box || 0) + 1) : Math.max(0, (s.box || 0) - 1); await setTopic(id, { box, next: P.addDays(today(), INTERVALS[box]), read: s.read || pct >= .8 }); await completePlan(mode === 'review' ? 'review' : 'practice', id); }
      P.snd.play(pct >= .8 ? 'award' : 'term');
      view.innerHTML = `<div class="card form center"><div class="lbl">Протокол занятия</div><div class="big" style="margin:10px 0">${ok} / ${N}</div>${bar(pct, pct >= .8 ? 'k' : '')}<p>${pct >= .8 ? 'Отличная работа. Следующее повторение назначено с увеличенным интервалом.' : pct >= .5 ? 'Неплохо. Повторите типичные ошибки и решите ещё серию.' : 'Тема требует внимания: перечитайте учебник и разберите эталонные решения.'}</p>
<div class="btns"><button class="btn" id="again">Ещё серия</button>${id !== 'mix' ? `<button class="btn sec" data-go="topic/${id}/book">К учебнику</button>` : ''}</div><div class="btns"><button class="btn ghost" data-go="plan">Учебный план</button></div></div>`;
      $('#again').onclick = () => render();
    };
    next();
    return () => ctl && ctl.destroy();
  });

  /* ================= ЭКЗАМЕНАЦИОННАЯ КОМИССИЯ ================= */
  R('exam', async (a, b) => {
    if (a === 'theme' && b) { const t = P.topicById(b); const ex = P.buildExam('theme', { subj: t.subj, topics: [b], count: 8, time: 20, title: 'Контрольное испытание: ' + t.title }); await DB.putExam(ex); return go('run/' + ex.id); }
    if (a === 'full') { const ex = P.buildExam('full', { subj: b }); await DB.putExam(ex); return go('run/' + ex.id); }
    setTop('Экзаменационная комиссия', 'ЕГЭ-2027', false);
    const exams = await DB.exams(), open = exams.filter(e => !e.finished), done = exams.filter(e => e.finished);
    view.innerHTML = `<div class="card red"><div class="lbl">Государственная экзаменационная подготовка</div><h2>Пробные экзамены</h2><p class="small">Полный вариант по структуре ЕГЭ, таймер 3 ч 55 мин, автосохранение ответов, проверка и разбор ошибок.</p>
<div class="btns"><button class="btn gold" data-go="exam/full/math">Математика</button><button class="btn gold" data-go="exam/full/phys">Физика</button></div></div>
<div class="note small"><b>Достоверность.</b> ${P.EXAM_SPEC.math.doc}<br>${P.EXAM_SPEC.phys.doc}<br>Задания — авторские, составлены по образцу типов КИМ; открытый банк ФИПИ в приложение не встроен. Шкала перевода в 100-балльную систему не приводится: её утверждает Рособрнадзор.</div>
${open.length ? `<div class="card"><h3>Незавершённые</h3>${open.map(e => `<button class="tap row" style="padding:10px 0" data-go="run/${e.id}"><div class="grow"><b>${esc(e.title)}</b><div class="small muted">${new Date(e.started).toLocaleString('ru-RU')} · ответов ${Object.keys(e.answers).length}/${e.items.length}</div></div><span class="badge r">продолжить</span></button>`).join('')}</div>` : ''}
<div class="card"><h3>Конструктор варианта</h3>
<div class="lbl">Предмет</div><div class="chips" id="bs"><button class="chip on" data-v="math">Математика</button><button class="chip" data-v="phys">Физика</button></div>
<div class="lbl" style="margin-top:10px">Темы</div><div class="chips" id="bt"></div>
<div class="lbl" style="margin-top:10px">Сложность</div><div class="chips" id="bl"><button class="chip on" data-v="0">Любая</button><button class="chip" data-v="1">Базовая</button><button class="chip" data-v="2">До средней</button><button class="chip" data-v="3">Средняя и повышенная</button></div>
<div class="lbl" style="margin-top:10px">Количество заданий</div><div class="chips" id="bn">${[5, 10, 15, 20].map((n, i) => `<button class="chip${i === 1 ? ' on' : ''}" data-v="${n}">${n}</button>`).join('')}</div>
<div class="lbl" style="margin-top:10px">Таймер</div><div class="chips" id="bm">${[[0, 'Без таймера'], [20, '20 мин'], [40, '40 мин'], [60, '60 мин']].map(([v, n], i) => `<button class="chip${i ? '' : ' on'}" data-v="${v}">${n}</button>`).join('')}</div>
<button class="btn full" id="bgo" style="margin-top:12px">Сформировать вариант</button></div>
<div class="card"><h3>Входная диагностика</h3><p class="small">12 задач по ключевым темам математики. Результаты задают стартовый уровень и учебный план.</p><button class="btn sec full" data-go="diag">${S.profile.diagDone ? 'Пройти повторно' : 'Начать диагностику'}</button></div>
<div class="card"><h3>Результаты испытаний</h3>${done.length ? done.slice(0, 20).map(e => `<button class="tap row" style="padding:8px 0;border-bottom:1px dashed var(--line)" data-go="res/${e.id}"><div class="grow"><b class="small">${esc(e.title)}</b><div class="small muted">${new Date(e.started).toLocaleDateString('ru-RU')}</div></div><b class="mono">${e.result ? e.result.sum + '/' + e.result.max : '—'}</b></button>`).join('') : '<p class="small muted">Пока нет завершённых испытаний.</p>'}</div>`;
    let subj = 'math', lvl = 0, cnt = 10, tm = 0, sel = new Set();

    chips('#bt', c => { const v = c.dataset.v; sel.has(v) ? sel.delete(v) : sel.add(v); c.classList.toggle('on'); });

    drawT();
    $('#bgo').onclick = async () => { const topics = sel.size ? [...sel] : TOP(subj).filter(t => P.gensFor(t.id).length).map(t => t.id); const ex = P.buildExam('theme', { subj, topics, level: lvl, count: cnt, time: tm, title: 'Вариант из конструктора: ' + (subj === 'math' ? 'математика' : 'физика') }); await DB.putExam(ex); go('run/' + ex.id); };
  });
  R('diag', async () => { const ex = P.buildExam('diag'); await DB.putExam(ex); go('run/' + ex.id); });

  R('run', async id => {
    const ex = await DB.getExam(id); if (!ex) return go('exam'); if (ex.finished) return go('res/' + id);
    setTop(ex.title, ex.items.length + ' заданий', true);
    let cur = 0, ctl = null, saveT = null;
    const left = () => ex.limit ? Math.max(0, ex.limit - Math.floor((Date.now() - ex.started) / 1000)) : null;
    const tfmt = s => `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    const tick = () => { const l = left(); const el = $('#tmr'); if (l === null || !el) return; el.textContent = tfmt(l); if (l <= 0) { clearInterval(P._timer); P.toast('Время вышло. Вариант завершён.'); finishExam(); } };
