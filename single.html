<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ПРОЕКТ 200">
<meta name="description" content="ПРОЕКТ 200 — персональная система подготовки к ЕГЭ по профильной математике и физике. Работает офлайн.">
<title>ПРОЕКТ 200</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ПРОЕКТ 200 — стили. Эстетика: НИИ / вычислительный центр 1960–80-х, современная вёрстка */
:root{
  --red:#b3261e; --red-d:#7f1913; --red-l:#f3d9d4;
  --cream:#f1e8d4; --paper:#fbf6ea; --white:#fffdf8;
  --ink:#231a14; --brown:#5a3d2b; --brown-l:#8a6a52;
  --gold:#b8954a; --gold-l:#e8d6a8;
  --ok:#2f6b3a; --ok-l:#dcebd5; --warn:#a8620f;
  --line:#d8c9a8;
  --r:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --hfont:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","DejaVu Sans Condensed",sans-serif;
  --sfont:Georgia,"Times New Roman","DejaVu Serif",serif;
  --bfont:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"DejaVu Sans",sans-serif;
  --mfont:ui-monospace,"SF Mono",Menlo,"Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font:16px/1.5 var(--bfont);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;
  background-image:radial-gradient(circle at 1px 1px,rgba(90,61,43,.07) 1px,transparent 0);background-size:14px 14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--red)}
h1,h2,h3,.h{font-family:var(--hfont);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.15;margin:0}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}
p{margin:.5em 0}
sup,sub{font-size:.72em;line-height:0}
.mono{font-family:var(--mfont)}
.muted{color:var(--brown-l)}
.small{font-size:13px}
.center{text-align:center}
.hide{display:none!important}

/* ===== шапка ===== */
#top{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 8px) calc(14px + var(--sar)) 8px calc(14px + var(--sal));
  background:linear-gradient(var(--red),var(--red-d));color:#fff;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 0 var(--gold),0 6px 18px rgba(60,20,10,.25)}
#top .back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:20px;color:#fff}
#top .ttl{flex:1;min-width:0}
#top .ttl b{display:block;font-family:var(--hfont);letter-spacing:.12em;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
#top .ttl span{display:block;font-size:11px;opacity:.8;letter-spacing:.1em;text-transform:uppercase}
#top .star{width:26px;height:26px}

/* ===== основное ===== */
#view{padding:14px calc(14px + var(--sar)) calc(96px + var(--sab)) calc(14px + var(--sal));max-width:720px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== нижняя навигация ===== */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--ink);
  padding:6px calc(4px + var(--sar)) calc(6px + var(--sab)) calc(4px + var(--sal));border-top:3px solid var(--red)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#cdbb9a;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:6px 0;border-radius:10px;min-height:48px}
#nav button svg{width:24px;height:24px}
#nav button.on{color:#fff;background:rgba(179,38,30,.35)}

/* ===== карточки ===== */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 3px 10px rgba(80,50,20,.07)}
.card.form{background:var(--paper);border:1.5px solid var(--brown);outline:1px solid var(--brown);outline-offset:-6px;padding:18px}
.card.red{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;border-color:var(--red-d)}
.card.dark{background:var(--ink);color:#e9dcc0;border-color:#000}
.card h2,.card h3{margin-bottom:8px}
.card .lbl{font-family:var(--hfont);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brown-l)}
.card.red .lbl,.card.dark .lbl{color:var(--gold-l)}
.tap{display:block;width:100%;text-align:left;transition:transform .12s}
.tap:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row>.grow{flex:1;min-width:0}
.sep{height:1px;background:var(--line);margin:12px 0}
.tile{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-height:96px;text-align:left}
.tile .ic{width:34px;height:34px;color:var(--red)}
.tile b{font-family:var(--hfont);letter-spacing:.08em;text-transform:uppercase;font-size:13px;line-height:1.15}
.tile small{color:var(--brown-l);font-size:12px;line-height:1.3}

/* ===== кнопки ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;background:var(--red);color:#fff;
  font-family:var(--hfont);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;box-shadow:0 3px 0 var(--red-d);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-d)}
.btn.sec{background:var(--white);color:var(--ink);border:1.5px solid var(--brown);box-shadow:0 3px 0 var(--brown)}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 #8a6d30}
.btn.ghost{background:transparent;color:var(--red);box-shadow:none;border:1.5px dashed var(--red)}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);font-size:13px;min-height:36px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;background:var(--paper);border:1.5px solid var(--brown);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;position:sticky;top:calc(var(--sat) + 58px);z-index:10}
.seg button{flex:1;min-height:38px;border-radius:9px;font-family:var(--hfont);letter-spacing:.06em;text-transform:uppercase;font-size:12px;font-weight:700;color:var(--brown)}
.seg button.on{background:var(--red);color:#fff}

/* ===== прогресс ===== */
.bar{height:10px;border-radius:6px;background:#e7dbc1;overflow:hidden;border:1px solid #d3c29e}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--red),var(--red) 6px,#c73a30 6px,#c73a30 12px);transition:width .6s}
.bar.g i{background:var(--gold)}
.bar.k i{background:var(--ok)}
.ring{width:84px;height:84px}
.big{font-family:var(--hfont);font-size:34px;font-weight:700;letter-spacing:.02em;line-height:1}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-family:var(--hfont);letter-spacing:.1em;text-transform:uppercase;background:var(--gold-l);color:var(--brown)}
.badge.r{background:var(--red-l);color:var(--red-d)}
.badge.k{background:var(--ok-l);color:var(--ok)}

/* ===== эмблема / шапка дела ===== */
.dossier-head{display:flex;gap:14px;align-items:center}
.emblem{width:96px;height:96px;flex:none;filter:drop-shadow(0 4px 8px rgba(80,20,10,.25))}
.motto{font-family:var(--hfont);letter-spacing:.2em;font-size:11px;text-transform:uppercase;color:var(--brown)}
.stamp{position:absolute;right:12px;top:10px;border:2.5px solid var(--red);color:var(--red);border-radius:8px;padding:2px 8px;font-family:var(--hfont);font-weight:700;letter-spacing:.12em;font-size:11px;transform:rotate(-8deg);opacity:.8;text-transform:uppercase}
.goal{font-family:var(--hfont);letter-spacing:.12em;text-transform:uppercase;font-size:13px;line-height:1.6}

/* ===== списки тем ===== */
.tl{list-style:none;margin:0;padding:0}
.tl li{border-bottom:1px dashed var(--line)}
.tl li:last-child{border:0}
.tl .tap{display:flex;gap:12px;align-items:center;padding:12px 2px;min-height:56px}
.num{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--brown);font-family:var(--hfont);font-weight:700;font-size:13px}
.num.done{background:var(--ok);border-color:var(--ok);color:#fff}
.num.mid{background:var(--gold);border-color:var(--gold);color:#fff}
.tl .t{flex:1;min-width:0}
.tl .t b{display:block;font-weight:600;font-size:15px}
.tl .t small{color:var(--brown-l);font-size:12px}

/* ===== учебный текст ===== */
.txt{font-family:var(--sfont);font-size:17px;line-height:1.6}
.txt h3{font-family:var(--hfont);margin:18px 0 6px;color:var(--red-d)}
.txt ul,.txt ol{padding-left:22px;margin:.4em 0}
.txt li{margin:.25em 0}
.txt table{border-collapse:collapse;width:100%;font-family:var(--bfont);font-size:14px;margin:8px 0}
.txt td,.txt th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.txt th{background:var(--paper);font-family:var(--hfont);letter-spacing:.05em}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.def{border-left:4px solid var(--red);background:var(--paper);padding:8px 12px;margin:10px 0;border-radius:0 10px 10px 0}
.def b{font-family:var(--hfont);letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--red-d)}
.note{border:1.5px dashed var(--gold);background:#fbf3df;padding:8px 12px;border-radius:10px;margin:10px 0;font-family:var(--bfont);font-size:15px}
.warnbox{border-left:4px solid var(--warn);background:#fbecd9;padding:8px 12px;border-radius:0 10px 10px 0;margin:8px 0;font-family:var(--bfont);font-size:15px}
.fm{display:block;font-family:var(--sfont);font-size:19px;text-align:center;padding:10px;margin:8px 0;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow-x:auto;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.92em}
.fr>i{font-style:normal;padding:0 3px}
.fr>i:first-child{border-bottom:1.2px solid currentColor}
.rt{white-space:nowrap}.rt>i{font-style:normal;border-top:1.2px solid currentColor;padding:0 2px}
.ftab{width:100%;border-collapse:collapse}
.ftab td{padding:8px 4px;border-bottom:1px dashed var(--line);vertical-align:middle}
.ftab td:first-child{font-size:13px;color:var(--brown);width:42%}
.ftab td:last-child{font-family:var(--sfont);font-size:17px}
.ex{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.ex>b{font-family:var(--hfont);font-size:12px;letter-spacing:.12em;color:var(--red);text-transform:uppercase}
details.sol>summary{cursor:pointer;color:var(--red);font-family:var(--hfont);letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:6px 0;list-style:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ "}
details.sol[open]>summary::before{content:"▾ "}

/* ===== задачи ===== */
.task{font-family:var(--sfont);font-size:17px;line-height:1.55}
.task .tq{margin-bottom:10px}
.vizbox{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:6px;margin:8px 0;text-align:center}
.vizbox svg{max-width:100%;height:auto}
.ansrow{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.ansf{flex:1;min-height:52px;border:2px solid var(--brown);border-radius:12px;background:var(--white);padding:10px 12px;font-family:var(--mfont);font-size:22px;display:flex;align-items:center;overflow-x:auto;white-space:nowrap}
.ansf.focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-l)}
.ansf .cur{display:inline-block;width:2px;height:24px;background:var(--red);animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.ansf .ph{color:#b9a888;font-size:15px;font-family:var(--bfont)}
.unitf{width:96px;min-height:52px;border:2px solid var(--brown);border-radius:12px;background:var(--white);padding:8px;font-size:18px;text-align:center}
input.txtin,textarea.txtin,select.txtin{width:100%;min-height:48px;border:1.5px solid var(--brown);border-radius:12px;background:var(--white);padding:10px 12px;font-size:16px}
textarea.txtin{min-height:110px;resize:vertical}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;user-select:none;-webkit-user-select:none}
.kp button{min-height:48px;border-radius:10px;background:var(--white);border:1px solid var(--line);font-size:20px;font-family:var(--mfont);box-shadow:0 2px 0 var(--line)}
.kp button:active{background:var(--gold-l);transform:translateY(1px)}
.kp button.op{background:var(--paper)}
.kp button.ok{background:var(--red);color:#fff;border-color:var(--red-d);box-shadow:0 2px 0 var(--red-d);font-family:var(--hfont);font-size:15px;letter-spacing:.08em}
.kp button.del{background:#eadfc8}
.fb{border-radius:12px;padding:12px;margin-top:12px;font-family:var(--bfont);font-size:15px;animation:fade .25s}
.fb.ok{background:var(--ok-l);border:1.5px solid var(--ok)}
.fb.bad{background:#f8e0dc;border:1.5px solid var(--red)}
.fb h4{margin:0 0 6px;font-family:var(--hfont);letter-spacing:.1em;text-transform:uppercase}
.fb ol{padding-left:20px;margin:6px 0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);font-family:var(--bfont);font-size:15px;min-height:48px}
.opt .k{width:26px;height:26px;border-radius:50%;border:2px solid var(--brown);display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
.opt.sel{border-color:var(--red);background:#fdf0ee}
.opt.sel .k{background:var(--red);border-color:var(--red);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.wrong{border-color:var(--red);background:#f8e0dc}
.match{display:flex;flex-direction:column;gap:10px;font-family:var(--bfont);font-size:15px}
.match .mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.match .ml{flex:1 1 140px}
.match .mb{display:flex;gap:4px}
.match .mb button{width:40px;height:40px;border-radius:9px;border:1.5px solid var(--line);background:var(--white);font-weight:700}
.match .mb button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.match .mb button.right{background:var(--ok);color:#fff}
.match .mb button.wrong{background:var(--red);color:#fff}
.steps{border-left:3px solid var(--gold);padding-left:10px;margin:8px 0}
.stepi{margin:10px 0}
.stepi .lbl2{font-family:var(--bfont);font-size:14px;color:var(--brown)}
.progdots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.progdots i{width:10px;height:10px;border-radius:50%;background:#e2d5b8}
.progdots i.ok{background:var(--ok)}.progdots i.bad{background:var(--red)}.progdots i.cur{outline:2px solid var(--ink)}

/* ===== экзамен ===== */
.timer{font-family:var(--mfont);font-size:20px;font-weight:700;background:var(--ink);color:#ffd27a;padding:6px 12px;border-radius:10px;letter-spacing:.06em}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qgrid button{height:42px;border-radius:9px;border:1.5px solid var(--line);background:var(--white);font-weight:700;font-family:var(--mfont)}
.qgrid button.ans{background:var(--gold-l);border-color:var(--gold)}
.qgrid button.cur{border-color:var(--red);box-shadow:0 0 0 2px var(--red-l)}
.qgrid button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.qgrid button.bad{background:var(--red);color:#fff;border-color:var(--red)}
.qgrid button.part{background:var(--gold);color:#fff}

/* ===== лаборатории ===== */
.lab canvas{width:100%;display:block;background:#fbf7ec;border-radius:12px;border:1px solid var(--line);touch-action:none}
.ctl{margin:10px 0}
.ctl label{display:flex;justify-content:space-between;font-size:14px;color:var(--brown);margin-bottom:2px}
.ctl label b{font-family:var(--mfont);color:var(--ink)}
input[type=range]{width:100%;height:36px;-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#e2d5b8;border:1px solid #cdbb94}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);margin-top:-11px}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#e2d5b8}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--red);border:3px solid #fff}
.readout{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:8px}
.readout div{background:var(--ink);color:#ffd27a;border-radius:8px;padding:6px 8px;font-family:var(--mfont);font-size:13px}
.readout div span{display:block;color:#cdbb9a;font-family:var(--bfont);font-size:11px}

/* ===== библиотека ===== */
.lib-item{border-bottom:1px dashed var(--line);padding:10px 0}
.lib-item .row b{font-size:15px}
.fav{font-size:22px;color:#c7b48c;width:40px;height:40px}
.fav.on{color:var(--gold)}

/* ===== модалки / тосты ===== */
#modal{position:fixed;inset:0;z-index:50;background:rgba(20,10,5,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
#modal .sheet{background:var(--paper);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px calc(16px + var(--sar)) calc(18px + var(--sab)) calc(16px + var(--sal));border-top:4px solid var(--red);-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sab));z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:fade .2s}
.promo{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(circle,rgba(179,38,30,.95),rgba(60,10,5,.97));color:#fff;text-align:center;padding:24px;animation:fade .3s}
.promo .st{width:150px;height:150px;animation:spin 1.2s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{from{transform:scale(.2) rotate(-180deg);opacity:0}to{transform:none;opacity:1}}
.cert{background:var(--paper);border:2px solid var(--brown);outline:1px solid var(--brown);outline-offset:-7px;border-radius:6px;padding:22px 18px;text-align:center;position:relative;color:var(--ink)}
.cert .ttl{font-family:var(--hfont);letter-spacing:.25em;color:var(--red);font-size:13px;text-transform:uppercase}
.cert .nm{font-family:var(--sfont);font-size:22px;margin:8px 0;border-bottom:1px solid var(--brown);display:inline-block;padding:0 10px}
.ach{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ach .md{width:44px;height:44px;flex:none}
.ach.off{opacity:.45;filter:grayscale(1)}

<script>
/* ПРОЕКТ 200 — ядро: утилиты, ГСЧ, разбор выражений, единицы измерения, звук */
'use strict';
const P = window.P = {};
P.VERSION = '1.0.0';
P.$ = (s, r = document) => r.querySelector(s);
P.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
P.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
P.today = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
P.addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return P.today(d); };
P.daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
P.clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ---------- форматирование чисел по-русски ---------- */
P.round = (x, n = 10) => { const k = Math.pow(10, n); return Math.round(x * k) / k; };
P.fmt = (x, n = 6) => {
  if (!isFinite(x)) return String(x);
  let s = String(P.round(x, n));
  if (/e/.test(s)) s = x.toPrecision(4);
  return s.replace('-', '−').replace('.', ',');
};
/* дробь в HTML */
P.F = (a, b) => `<span class="fr"><i>${a}</i><i>${b}</i></span>`;
P.R = a => `<span class="rt">√<i>${a}</i></span>`;

/* ---------- ГСЧ с зерном (для воспроизводимых вариантов) ---------- */
P.rng = seed => {
  let a = (seed >>> 0) || 1;
  const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.sign = () => (r() < .5 ? -1 : 1);
  r.shuffle = arr => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  r.intNZ = (lo, hi) => { let v; do v = r.int(lo, hi); while (v === 0); return v; };
  return r;
};
P.seed = () => (Math.random() * 2 ** 31) >>> 0;

/* ---------- безопасный разбор математического выражения (без eval) ---------- */
P.parseExpr = function (src) {
  let s = String(src || '').trim();
  if (!s) return NaN;
  s = s.replace(/\s+/g, '').replace(/[−–—]/g, '-').replace(/[×·*]/g, '*').replace(/[÷:]/g, '/')
    .replace(/,/g, '.').replace(/pi|пи/gi, 'π').replace(/sqrt|корень/gi, '√').replace(/²/g, '^2').replace(/³/g, '^3');
  let i = 0;
  const peek = () => s[i];
  const num = () => { const m = /^\d*\.?\d+(?:e[+-]?\d+)?|^\d+\.?/i.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); };
  function primary() {
    const c = peek();
    if (c === '(') { i++; const v = expr(); if (s[i] !== ')') throw 0; i++; return v; }
    if (c === 'π') { i++; return Math.PI; }
    if (c === '√') { i++; const v = unary(); if (v < 0) throw 0; return Math.sqrt(v); }
    if (/[\d.]/.test(c)) return num();
    throw 0;
  }
  function power() { const b = primary(); if (peek() === '^') { i++; const e = unary(); return Math.pow(b, e); } return b; }
  function unary() { if (peek() === '-') { i++; return -unary(); } if (peek() === '+') { i++; return unary(); } return power(); }
  function term() {
    let v = unary();
    for (;;) {
      const c = peek();
      if (c === '*') { i++; v *= unary(); }
      else if (c === '/') { i++; const d = unary(); v /= d; }
      else if (c === '(' || c === 'π' || c === '√') v *= power();
      else return v;
    }
  }
  function expr() { let v = term(); for (;;) { const c = peek(); if (c === '+') { i++; v += term(); } else if (c === '-') { i++; v -= term(); } else return v; } }
  try { const v = expr(); if (i !== s.length) return NaN; return v; } catch (e) { return NaN; }
};

/* ---------- единицы измерения и размерности ---------- */
/* размерность: [м, кг, с, А, К, моль] */
(function () {
  const U = {
    'м': [1, [1, 0, 0, 0, 0, 0]], 'г': [1e-3, [0, 1, 0, 0, 0, 0]], 'с': [1, [0, 0, 1, 0, 0, 0]], 'мин': [60, [0, 0, 1, 0, 0, 0]], 'ч': [3600, [0, 0, 1, 0, 0, 0]],
    'сут': [86400, [0, 0, 1, 0, 0, 0]], 'А': [1, [0, 0, 0, 1, 0, 0]], 'К': [1, [0, 0, 0, 0, 1, 0]], 'моль': [1, [0, 0, 0, 0, 0, 1]], 'т': [1000, [0, 1, 0, 0, 0, 0]],
    'Н': [1, [1, 1, -2, 0, 0, 0]], 'Дж': [1, [2, 1, -2, 0, 0, 0]], 'Вт': [1, [2, 1, -3, 0, 0, 0]], 'Па': [1, [-1, 1, -2, 0, 0, 0]],
    'Кл': [1, [0, 0, 1, 1, 0, 0]], 'В': [1, [2, 1, -3, -1, 0, 0]], 'Ом': [1, [2, 1, -3, -2, 0, 0]], 'Гц': [1, [0, 0, -1, 0, 0, 0]],
    'Тл': [1, [0, 1, -2, -1, 0, 0]], 'Ф': [1, [-2, -1, 4, 2, 0, 0]], 'Гн': [1, [2, 1, -2, -2, 0, 0]], 'Вб': [1, [2, 1, -2, -1, 0, 0]],
    'эВ': [1.602176634e-19, [2, 1, -2, 0, 0, 0]], 'л': [1e-3, [3, 0, 0, 0, 0, 0]], 'дптр': [1, [-1, 0, 0, 0, 0, 0]], 'рад': [1, [0, 0, 0, 0, 0, 0]],
    'об': [1, [0, 0, 0, 0, 0, 0]], '%': [0.01, [0, 0, 0, 0, 0, 0]], 'атм': [101325, [-1, 1, -2, 0, 0, 0]]
  };
  const PRE = [['мк', 1e-6], ['М', 1e6], ['Г', 1e9], ['к', 1e3], ['м', 1e-3], ['с', 1e-2], ['д', 1e-1], ['н', 1e-9], ['п', 1e-12]];
  const LAT = { m: 'м', kg: 'кг', g: 'г', s: 'с', N: 'Н', J: 'Дж', W: 'Вт', Pa: 'Па', C: 'Кл', V: 'В', A: 'А', K: 'К', Hz: 'Гц', T: 'Тл', h: 'ч', ohm: 'Ом', 'Ω': 'Ом', eV: 'эВ', mol: 'моль' };
  function one(tok) {
    if (LAT[tok]) tok = LAT[tok];
    if (U[tok]) return { f: U[tok][0], d: U[tok][1].slice() };
    for (const [p, k] of PRE) if (tok.startsWith(p) && U[tok.slice(p.length)]) { const u = U[tok.slice(p.length)]; return { f: k * u[0], d: u[1].slice() }; }
    return null;
  }
  P.parseUnit = function (str) {
    let s = String(str || '').trim().replace(/[·*×]/g, '*').replace(/\s+/g, '*').replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁻¹/g, '^-1').replace(/[−–]/g, '-');
    if (!s) return null;
    const res = { f: 1, d: [0, 0, 0, 0, 0, 0] };
    const re = /([*/]?)([A-Za-zА-Яа-яЁёΩ%]+)(?:\^?(-?\d+))?/g;
    let m, used = 0;
    while ((m = re.exec(s))) {
      used += m[0].length;
      const u = one(m[2]); if (!u) return { err: 'неизвестная единица «' + m[2] + '»' };
      const pw = (m[3] ? parseInt(m[3], 10) : 1) * (m[1] === '/' ? -1 : 1);
      res.f *= Math.pow(u.f, pw); for (let k = 0; k < 6; k++) res.d[k] += u.d[k] * pw;
    }
    if (used !== s.length) return { err: 'не удалось разобрать запись единиц' };
    return res;
  };
  const NAMES = [
    [[1, 0, 0, 0, 0, 0], 'длина'], [[0, 1, 0, 0, 0, 0], 'масса'], [[0, 0, 1, 0, 0, 0], 'время'], [[1, 0, -1, 0, 0, 0], 'скорость'],
    [[1, 0, -2, 0, 0, 0], 'ускорение'], [[1, 1, -2, 0, 0, 0], 'сила'], [[2, 1, -2, 0, 0, 0], 'энергия (работа)'], [[2, 1, -3, 0, 0, 0], 'мощность'],
    [[1, 1, -1, 0, 0, 0], 'импульс'], [[-1, 1, -2, 0, 0, 0], 'давление'], [[0, 0, -1, 0, 0, 0], 'частота'], [[2, 0, 0, 0, 0, 0], 'площадь'],
    [[3, 0, 0, 0, 0, 0], 'объём'], [[0, 0, 0, 1, 0, 0], 'сила тока'], [[2, 1, -3, -1, 0, 0], 'напряжение'], [[2, 1, -3, -2, 0, 0], 'сопротивление'],
    [[0, 0, 1, 1, 0, 0], 'заряд'], [[0, 0, 0, 0, 1, 0], 'температура'], [[-3, 1, 0, 0, 0, 0], 'плотность'], [[0, 0, 0, 0, 0, 0], 'безразмерная величина'],
    [[1, 1, -3, -1, 0, 0], 'напряжённость поля'], [[0, 1, -2, -1, 0, 0], 'магнитная индукция'], [[2, 1, -2, -1, 0, 0], 'магнитный поток']
  ];
  P.dimName = d => { for (const [v, n] of NAMES) if (v.every((x, i) => x === d[i])) return n; return 'величина другой размерности'; };
  P.sameDim = (a, b) => a.every((x, i) => x === b[i]);
})();

/* ---------- звук: синтез Web Audio (локально, без файлов) ---------- */
P.snd = (function () {
  let ctx = null, gain = null;
  const st = { on: true, vol: 0.5 };
  function ensure() {
    if (!st.on || st.vol <= 0) return null;
    try {
      if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); gain = ctx.createGain(); gain.connect(ctx.destination); }
      if (ctx.state === 'suspended') ctx.resume();
      gain.gain.value = st.vol * 0.35;
      return ctx;
    } catch (e) { return null; }
  }
  function tone(f, t0, dur, type = 'square', v = 1, f2) {
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, c.currentTime + t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + t0 + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(v, c.currentTime + t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(g); g.connect(gain); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.02);
  }
  function noise(t0, dur, v = .5) {
    const c = ensure(); if (!c) return;
    const n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
    const s = c.createBufferSource(), g = c.createGain(), fl = c.createBiquadFilter();
    fl.type = 'highpass'; fl.frequency.value = 1800; g.gain.value = v;
    s.buffer = b; s.connect(fl); fl.connect(g); g.connect(gain); s.start(c.currentTime + t0);
  }
  const S = {
    key() { noise(0, .03, .6); },
    toggle() { noise(0, .02, .7); tone(140, 0, .04, 'square', .3); },
    nav() { tone(880, 0, .05, 'square', .15); },
    ok() { tone(660, 0, .09, 'square', .25); tone(990, .09, .14, 'square', .25); },
    bad() { tone(220, 0, .12, 'sawtooth', .25); tone(165, .12, .2, 'sawtooth', .25); },
    boot() { [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .08, .1, 'square', .18)); noise(0, .15, .3); },
    award() { [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, i * .12, .25, 'triangle', .35)); },
    term() { tone(1200, 0, .06, 'sine', .3); tone(1200, .1, .06, 'sine', .3); }
  };
  return {
    set(on, vol) { st.on = !!on; st.vol = +vol; },
    play(name) { try { if (st.on && S[name]) S[name](); } catch (e) { } },
    get on() { return st.on; }, get vol() { return st.vol; }
  };
})();

/* ---------- мелкий UI ---------- */
P.toast = function (msg, ms = 2200) {
  let t = P.$('#toast'); if (t) t.remove();
  t = document.createElement('div'); t.id = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
};
P.modal = function (html, onMount) {
  P.closeModal();
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) P.closeModal(); });
  document.body.appendChild(m); if (onMount) onMount(m.firstChild);
  return m.firstChild;
};
P.closeModal = () => { const m = P.$('#modal'); if (m) m.remove(); };

/* SVG-эмблема ПРОЕКТ 200 */
P.emblem = (cls = 'emblem') => `<svg class="${cls}" viewBox="0 0 200 200" aria-label="Эмблема ПРОЕКТ 200">
<defs><path id="arcT" d="M30 100a70 70 0 0 1 140 0"/><path id="arcB" d="M26 100a74 74 0 0 0 148 0"/></defs>
<circle cx="100" cy="100" r="96" fill="#7f1913"/><circle cx="100" cy="100" r="90" fill="none" stroke="#b8954a" stroke-width="3"/>
<circle cx="100" cy="100" r="68" fill="#b3261e" stroke="#e8d6a8" stroke-width="2"/>
<g fill="#e8d6a8">${Array.from({ length: 24 }, (_, i) => { const a = i * Math.PI / 12; return `<circle cx="${100 + 80 * Math.cos(a)}" cy="${100 + 80 * Math.sin(a)}" r="1.6"/>`; }).join('')}</g>
<path transform="translate(100 62) scale(.38) translate(-50 -50)" fill="#ffd27a" d="M50 4l13.4 31.6 34.2 3-26 22.5 7.8 33.5L50 77 20.6 94.6l7.8-33.5-26-22.5 34.2-3z"/>
<text x="100" y="128" text-anchor="middle" font-family="Avenir Next Condensed,Arial Narrow,DejaVu Sans Condensed,sans-serif" font-weight="800" font-size="56" fill="#fffdf8" letter-spacing="1">200</text>
<text x="100" y="146" text-anchor="middle" font-family="Avenir Next Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="11" fill="#e8d6a8" letter-spacing="3">ПРОЕКТ</text>
</svg>`;

<script>
/* ПРОЕКТ 200 — хранилище: IndexedDB с резервом в localStorage, экспорт/импорт */
'use strict';
P.DB = (function () {
  const NAME = 'proekt200', VER = 1, SCHEMA = 1;
  let db = null, mode = 'idb';
  const mem = {}; // кэш kv в памяти для синхронного чтения

  function open() {
    return new Promise(res => {
      if (!('indexedDB' in window)) { mode = 'ls'; return res(); }
      let req;
      try { req = indexedDB.open(NAME, VER); } catch (e) { mode = 'ls'; return res(); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('attempts')) { const s = d.createObjectStore('attempts', { keyPath: 'id', autoIncrement: true }); s.createIndex('topic', 'topic'); }
        if (!d.objectStoreNames.contains('exams')) d.createObjectStore('exams', { keyPath: 'id' });
      };
      req.onsuccess = () => { db = req.result; res(); };
      req.onerror = () => { mode = 'ls'; res(); };
      req.onblocked = () => { mode = 'ls'; res(); };
    });
  }
  const tx = (store, rw) => db.transaction(store, rw ? 'readwrite' : 'readonly').objectStore(store);
  const p = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  const lsKey = (s, k) => 'p200:' + s + ':' + k;
  function lsAll(s) { const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('p200:' + s + ':')) try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e) { } } return out; }

  async function loadKV() {
    if (mode === 'idb') {
      const s = tx('kv'); const keys = await p(s.getAllKeys()); const vals = await p(tx('kv').getAll());
      keys.forEach((k, i) => mem[k] = vals[i]);
    } else {
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('p200:kv:')) try { mem[k.slice(8)] = JSON.parse(localStorage.getItem(k)); } catch (e) { } }
    }
  }
  const api = {
    async init() { await open(); try { await loadKV(); } catch (e) { mode = 'ls'; await loadKV(); } return mode; },
    get mode() { return mode; },
    get(k, def) { return k in mem ? mem[k] : def; },
    async set(k, v) {
      mem[k] = v;
      try { if (mode === 'idb') await p(tx('kv', 1).put(v, k)); else localStorage.setItem(lsKey('kv', k), JSON.stringify(v)); }
      catch (e) { console.warn('save fail', e); P.toast('Ошибка сохранения: ' + (e && e.name || e)); }
    },
    async addAttempt(a) {
      a.ts = a.ts || Date.now();
      if (mode === 'idb') { a.id = await p(tx('attempts', 1).add(a)); }
      else { a.id = Date.now() + Math.random(); localStorage.setItem(lsKey('attempts', a.id), JSON.stringify(a)); }
      return a;
    },
    async attempts() { return mode === 'idb' ? p(tx('attempts').getAll()) : lsAll('attempts'); },
    async putExam(e) { if (mode === 'idb') await p(tx('exams', 1).put(e)); else localStorage.setItem(lsKey('exams', e.id), JSON.stringify(e)); },
    async exams() { const l = mode === 'idb' ? await p(tx('exams').getAll()) : lsAll('exams'); return l.sort((a, b) => b.started - a.started); },
    async getExam(id) { return mode === 'idb' ? p(tx('exams').get(id)) : JSON.parse(localStorage.getItem(lsKey('exams', id)) || 'null'); },
    async delExam(id) { if (mode === 'idb') await p(tx('exams', 1).delete(id)); else localStorage.removeItem(lsKey('exams', id)); },

    async exportAll() {
      return { app: 'ПРОЕКТ 200', schema: SCHEMA, appVersion: P.VERSION, exported: new Date().toISOString(), kv: { ...mem }, attempts: await api.attempts(), exams: await api.exams() };
    },
    validate(data) {
      if (!data || typeof data !== 'object') return 'Файл не является резервной копией';
      if (data.app !== 'ПРОЕКТ 200') return 'Это не резервная копия «ПРОЕКТ 200»';
      if (typeof data.schema !== 'number') return 'Не указана версия формата данных';
      if (data.schema > SCHEMA) return `Копия создана более новой версией (формат ${data.schema}). Обновите приложение.`;
      if (!data.kv || !Array.isArray(data.attempts) || !Array.isArray(data.exams)) return 'Повреждённая структура данных';
      return null;
    },
    async importAll(data) {
      const err = api.validate(data); if (err) throw new Error(err);
      await api.wipe();
      for (const [k, v] of Object.entries(data.kv)) await api.set(k, v);
      for (const a of data.attempts) { const c = { ...a }; if (mode === 'idb') delete c.id; await api.addAttempt(c); }
      for (const e of data.exams) await api.putExam(e);
    },
    async wipe() {
      Object.keys(mem).forEach(k => delete mem[k]);
      if (mode === 'idb') { for (const s of ['kv', 'attempts', 'exams']) await p(tx(s, 1).clear()); }
      else { const ks = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('p200:')) ks.push(k); } ks.forEach(k => localStorage.removeItem(k)); }
    },
    async persist() { try { if (navigator.storage && navigator.storage.persist) return await navigator.storage.persist(); } catch (e) { } return false; },
    async persisted() { try { if (navigator.storage && navigator.storage.persisted) return await navigator.storage.persisted(); } catch (e) { } return false; },
    SCHEMA
  };
  return api;
})();

<ul><li>D &gt; 0 — два корня x = ${F('−b ± √D', '2a')};</li><li>D = 0 — один корень x = −${F('b', '2a')};</li><li>D &lt; 0 — действительных корней нет.</li></ul>

  T({ id: 'm6', title: 'Неравенства', short: 'Линейные, квадратные, метод интервалов',
    theory: `<h3>Линейные неравенства</h3><p>Решаются как уравнения, но при <b>умножении или делении на отрицательное число знак неравенства меняется</b>.</p>
<h3>Квадратные неравенства</h3><p>Для ax<sup>2</sup> + bx + c &gt; 0: найдите корни, нарисуйте параболу (ветви вверх при a &gt; 0) и выберите промежутки, где график выше оси Ox.</p>
<h3>Метод интервалов</h3><ol><li>Перенесите всё в одну часть, справа 0.</li><li>Разложите на множители.</li><li>Отметьте нули числителя и знаменателя (знаменатель — выколотые точки).</li><li>Определите знак на крайнем правом интервале и чередуйте знаки (кроме корней чётной кратности).</li><li>Выберите промежутки нужного знака.</li></ol>
<h3>Показательные и логарифмические</h3><p>При основании a &gt; 1 знак сохраняется, при 0 &lt; a &lt; 1 — меняется. Для логарифмов дополнительно учитывайте, что аргументы положительны.</p>`,
    sum: ['Умножение на отрицательное число меняет знак неравенства', '(x − p)(x − q) ≤ 0 при p < q ⇔ p ≤ x ≤ q', 'Метод интервалов: нули → знаки → ответ', 'Знаменатель ≠ 0 — точки выколоты', '0 < a < 1: знак при переходе к показателям меняется'],
    f: [['Квадратное неравенство', '(x−p)(x−q) &lt; 0 ⇔ p &lt; x &lt; q (p &lt; q)'], ['Показательное, a &gt; 1', 'a<sup>f</sup> &gt; a<sup>g</sup> ⇔ f &gt; g'], ['Показательное, 0&lt;a&lt;1', 'a<sup>f</sup> &gt; a<sup>g</sup> ⇔ f &lt; g']],
    defs: [['Решение неравенства', 'множество всех значений переменной, при которых неравенство верно']],
    ex: [['Решите (x − 1)(x + 3) ≤ 0', 'Нули: −3 и 1, ветви вверх. Ответ: [−3; 1].']],
    err: ['Не меняют знак при делении на отрицательное число', 'Включают в ответ нули знаменателя', 'Чередуют знак через корень чётной кратности'],
    gens: ['m_ineq', 'm_ineq_lin'], viz: 'graph', ege: '№16 (часть 2, по проекту 2027)' });

  T({ id: 'm7', title: 'Системы уравнений', short: 'Подстановка, сложение, графический смысл',
    theory: `<h3>Что значит решить систему</h3><p>Найти все пары (x; y), удовлетворяющие <b>каждому</b> уравнению одновременно. Графически — точки пересечения графиков.</p>
<h3>Метод подстановки</h3><p>Выразите одну переменную из простого уравнения и подставьте в другое.</p>
<h3>Метод сложения</h3><p>Умножьте уравнения на числа так, чтобы коэффициенты при одной переменной стали противоположными, и сложите.</p>
<div class="note">2x + 3y = 13 и x − y = −1. Из второго x = y − 1; 2(y − 1) + 3y = 13 ⇒ 5y = 15 ⇒ y = 3, x = 2.</div>
<h3>Число решений линейной системы</h3><p>Прямые пересекаются — одно решение; параллельны — нет решений; совпадают — бесконечно много.</p>`,
    sum: ['Решение системы — общая точка графиков', 'Подстановка: выразить → подставить', 'Сложение: уравнять коэффициенты → сложить', 'a₁/a₂ ≠ b₁/b₂ — единственное решение'],
    f: [['Условие единственности (линейная система)', `${F('a<sub>1</sub>', 'a<sub>2</sub>')} ≠ ${F('b<sub>1</sub>', 'b<sub>2</sub>')}`]],
    defs: [['Решение системы', 'пара значений, обращающая каждое уравнение системы в верное равенство']],
    ex: [['x + y = 7, x − y = 1', 'Сложим: 2x = 8, x = 4, y = 3.']],

  T({ id: 'm8', title: 'Функции', short: 'Определение, область определения, свойства, монотонность',
    theory: `<h3>Понятие функции</h3><div class="def"><b>Функция</b> — правило, по которому каждому x из области определения D(f) ставится в соответствие ровно одно значение y = f(x).</div>
<h3>Свойства</h3><ul><li><b>Нули</b> — x, при которых f(x) = 0.</li><li><b>Монотонность</b>: возрастает, если большему x соответствует большее f(x).</li><li><b>Чётность</b>: f(−x) = f(x) — чётная (график симметричен относительно Oy); f(−x) = −f(x) — нечётная (симметрия относительно начала координат).</li><li><b>Наибольшее и наименьшее значения</b> на промежутке.</li><li><b>Периодичность</b>: f(x + T) = f(x).</li></ul>
<h3>Основные функции</h3><table><tr><th>Функция</th><th>Свойство</th></tr><tr><td>y = kx + b</td><td>k — угловой коэффициент</td></tr><tr><td>y = ax<sup>2</sup> + bx + c</td><td>вершина x₀ = −b/(2a)</td></tr><tr><td>y = k/x</td><td>гипербола</td></tr><tr><td>y = a<sup>x</sup></td><td>возрастает при a &gt; 1</td></tr><tr><td>y = log<sub>a</sub>x</td><td>D: x &gt; 0</td></tr></table>`,
    sum: ['Функция: каждому x — ровно один y', 'Чётная: f(−x) = f(x); нечётная: f(−x) = −f(x)', 'Вершина параболы: x₀ = −b/(2a)', 'При a > 0 у параболы минимум в вершине'],
    f: [['Вершина параболы', `x<sub>0</sub> = −${F('b', '2a')}`], ['Значение в вершине', `y<sub>0</sub> = −${F('D', '4a')}`]],
    defs: [['Область определения', 'множество всех допустимых значений аргумента'], ['Область значений', 'множество всех значений, которые принимает функция']],
    ex: [['f(x) = x² − 6x + 5. Найдите наименьшее значение.', 'x₀ = 3, f(3) = 9 − 18 + 5 = −4.']],
    err: ['Путают точку минимума (x) и наименьшее значение (y)', 'Забывают ограничения области определения'],
    gens: ['m_fval', 'm_vertex'], viz: 'graph', ege: 'Свойства функций, графики' });

  T({ id: 'm9', title: 'Графики функций', short: 'Чтение графиков, преобразования, коэффициенты',
    theory: `<h3>Линейная функция y = kx + b</h3><p>k = ${F('Δy', 'Δx')} — тангенс угла наклона прямой; b — ордината точки пересечения с Oy. По двум точкам: k = ${F('y<sub>2</sub> − y<sub>1</sub>', 'x<sub>2</sub> − x<sub>1</sub>')}.</p>
<h3>Парабола y = a(x − h)<sup>2</sup> + k</h3><p>Вершина (h; k). a &gt; 0 — ветви вверх; |a| &gt; 1 — парабола «уже». Чтобы найти a по графику, возьмите точку, отстоящую от вершины на 1 по x: тогда y − k = a.</p>
<h3>Преобразования графиков</h3><table><tr><td>y = f(x) + c</td><td>сдвиг вверх на c</td></tr><tr><td>y = f(x − c)</td><td>сдвиг вправо на c</td></tr><tr><td>y = −f(x)</td><td>отражение относительно Ox</td></tr><tr><td>y = f(−x)</td><td>отражение относительно Oy</td></tr><tr><td>y = k·f(x)</td><td>растяжение вдоль Oy</td></tr><tr><td>y = |f(x)|</td><td>нижняя часть отражается вверх</td></tr></table>
<p>Откройте вкладку «Визуализация», чтобы менять коэффициенты и наблюдать изменение графика.</p>`,
    sum: ['k = (y₂ − y₁)/(x₂ − x₁)', 'y = a(x − h)² + k: вершина (h; k)', 'f(x − c) — сдвиг вправо', 'Точки читать по узлам клеток'],
    f: [['Угловой коэффициент', `k = ${F('y<sub>2</sub>−y<sub>1</sub>', 'x<sub>2</sub>−x<sub>1</sub>')}`], ['Вершинная форма', 'y = a(x − h)<sup>2</sup> + k']],
    defs: [['График функции', 'множество точек (x; f(x)) координатной плоскости']],
    ex: [['Прямая проходит через (1; 3) и (3; 7). Найдите k и b.', 'k = (7 − 3)/(3 − 1) = 2; 3 = 2·1 + b ⇒ b = 1.']],
    err: ['f(x − c) сдвигают влево', 'Неверно считывают точки, не лежащие в узлах сетки'],
    gens: ['m_line2pts', 'm_parabola_read'], viz: 'graph', ege: 'Задание на графики (часть 1)' });

  T({ id: 'm10', title: 'Тригонометрия', short: 'Единичная окружность, формулы, уравнения',
    theory: `<h3>Единичная окружность</h3><p>Точка окружности радиуса 1, повернутая на угол α от оси Ox, имеет координаты (cos α; sin α). tg α = ${F('sin α', 'cos α')}. Радианы: π рад = 180°.</p>
<table><tr><th>α</th><th>0</th><th>π/6</th><th>π/4</th><th>π/3</th><th>π/2</th></tr><tr><td>sin</td><td>0</td><td>1/2</td><td>√2/2</td><td>√3/2</td><td>1</td></tr><tr><td>cos</td><td>1</td><td>√3/2</td><td>√2/2</td><td>1/2</td><td>0</td></tr><tr><td>tg</td><td>0</td><td>√3/3</td><td>1</td><td>√3</td><td>—</td></tr></table>
<h3>Знаки по четвертям</h3><p>sin &gt; 0 в I и II четвертях, cos &gt; 0 в I и IV, tg &gt; 0 в I и III.</p>
<h3>Основные формулы</h3><p>sin<sup>2</sup>α + cos<sup>2</sup>α = 1; 1 + tg<sup>2</sup>α = ${F(1, 'cos<sup>2</sup>α')}; sin 2α = 2 sin α cos α; cos 2α = cos<sup>2</sup>α − sin<sup>2</sup>α = 1 − 2sin<sup>2</sup>α. Формулы приведения: «лошадиное правило» — при π/2 и 3π/2 функция меняется на кофункцию, знак определяется по исходной функции в нужной четверти.</p>
<h3>Простейшие уравнения</h3><p>sin x = a (|a| ≤ 1): x = (−1)<sup>n</sup>arcsin a + πn; cos x = a: x = ±arccos a + 2πn; tg x = a: x = arctg a + πn, n ∈ ℤ.</p>`,
    sum: ['(cos α; sin α) — точка единичной окружности', 'sin²α + cos²α = 1', 'sin 2α = 2 sin α cos α', 'cos x = a ⇒ x = ±arccos a + 2πn', 'Знак sin/cos определяйте по четверти'],
    f: [['Основное тождество', 'sin<sup>2</sup>α + cos<sup>2</sup>α = 1'], ['Тангенс', `tg α = ${F('sin α', 'cos α')}`], ['Синус двойного угла', 'sin 2α = 2 sin α cos α'], ['Косинус двойного угла', 'cos 2α = 1 − 2sin<sup>2</sup>α'], ['Связь tg и cos', `1 + tg<sup>2</sup>α = ${F(1, 'cos<sup>2</sup>α')}`], ['Уравнение sin x = a', 'x = (−1)<sup>n</sup>arcsin a + πn']],
    defs: [['Радиан', 'центральный угол, опирающийся на дугу длиной, равной радиусу']],
    ex: [['cos α = 0,6, α ∈ (3π/2; 2π). Найдите sin α.', 'sin²α = 1 − 0,36 = 0,64; в IV четверти sin < 0 ⇒ sin α = −0,8.']],
    err: ['Не учитывают знак по четверти', 'Путают arcsin и arccos в общих формулах', 'Теряют серию решений'],
    gens: ['m_trig_id', 'm_trigval'], viz: 'circle', ege: 'Часть 1; №14 (часть 2, по проекту 2027)' });

  T({ id: 'm11', title: 'Производная', short: 'Определение, правила, касательная, экстремумы',
    theory: `<h3>Смысл производной</h3><p>f′(x<sub>0</sub>) — мгновенная скорость изменения функции; <b>геометрически</b> — угловой коэффициент (тангенс угла наклона) касательной к графику в точке x<sub>0</sub>; <b>физически</b> — скорость, если f — координата от времени.</p>
<h3>Таблица производных</h3><table><tr><td>(C)′ = 0</td><td>(x<sup>n</sup>)′ = n·x<sup>n−1</sup></td></tr><tr><td>(sin x)′ = cos x</td><td>(cos x)′ = −sin x</td></tr><tr><td>(e<sup>x</sup>)′ = e<sup>x</sup></td><td>(ln x)′ = 1/x</td></tr><tr><td>(√x)′ = ${F(1, '2√x')}</td><td>(a<sup>x</sup>)′ = a<sup>x</sup>ln a</td></tr></table>
<h3>Правила</h3><p>(u ± v)′ = u′ ± v′; (uv)′ = u′v + uv′; (${F('u', 'v')})′ = ${F('u′v − uv′', 'v<sup>2</sup>')}; f(g(x))′ = f′(g)·g′.</p>
<h3>Касательная</h3><p>y = f(x<sub>0</sub>) + f′(x<sub>0</sub>)(x − x<sub>0</sub>).</p>
<h3>Экстремумы</h3><p>Если f′ меняет знак с «+» на «−» — точка максимума; с «−» на «+» — минимума. Наибольшее значение на отрезке ищут среди значений в критических точках и на концах отрезка.</p>`,
    sum: ['f′(x₀) = tg угла наклона касательной', '(xⁿ)′ = nxⁿ⁻¹', '(uv)′ = u′v + uv′', 'f′: + → − — максимум; − → + — минимум', 'Наибольшее на [a; b]: сравнить f в критических точках и на концах'],
    f: [['Степенная функция', '(x<sup>n</sup>)′ = n·x<sup>n−1</sup>'], ['Произведение', '(uv)′ = u′v + uv′'], ['Частное', `(${F('u', 'v')})′ = ${F('u′v − uv′', 'v<sup>2</sup>')}`], ['Сложная функция', '(f(g(x)))′ = f′(g)·g′(x)'], ['Касательная', 'y = f(x<sub>0</sub>) + f′(x<sub>0</sub>)(x − x<sub>0</sub>)']],
    defs: [['Производная', 'предел отношения приращения функции к приращению аргумента при Δx → 0'], ['Критическая точка', 'внутренняя точка области определения, где f′ = 0 или не существует']],
    ex: [['f(x) = x³ − 12x. Точка максимума?', 'f′ = 3x² − 12 = 0 ⇒ x = ±2. Знаки: + на (−∞; −2), − на (−2; 2), + на (2; ∞). Максимум в x = −2.']],
    err: ['Путают точку экстремума и значение функции', 'Не проверяют концы отрезка', '(uv)′ ≠ u′v′'],
    gens: ['m_deriv_val', 'm_extr'], viz: 'deriv', ege: 'Производная в части 1; исследование функций' });

  T({ id: 'm12', title: 'Первообразная и интеграл', short: 'Первообразная, площадь криволинейной трапеции',
    theory: `<h3>Первообразная</h3><div class="def"><b>Определение.</b> F — первообразная f на промежутке, если F′(x) = f(x).</div><p>Если F — первообразная, то все первообразные: F(x) + C.</p>
<table><tr><th>f(x)</th><th>F(x)</th></tr><tr><td>x<sup>n</sup> (n ≠ −1)</td><td>${F('x<sup>n+1</sup>', 'n+1')}</td></tr><tr><td>1/x</td><td>ln|x|</td></tr><tr><td>e<sup>x</sup></td><td>e<sup>x</sup></td></tr><tr><td>sin x</td><td>−cos x</td></tr><tr><td>cos x</td><td>sin x</td></tr></table>

  T({ id: 'm13', title: 'Планиметрия', short: 'Треугольники, четырёхугольники, окружность, площади',
    theory: `<h3>Треугольник</h3><p>Сумма углов 180°. Внешний угол равен сумме двух несмежных внутренних. <b>Теорема Пифагора</b>: c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> (c — гипотенуза). <b>Теорема косинусов</b>: c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> − 2ab cos γ. <b>Теорема синусов</b>: ${F('a', 'sin α')} = 2R.</p>

<h3>Прямоугольный треугольник</h3><p>sin A = ${F('противолежащий катет', 'гипотенуза')}, cos A = ${F('прилежащий', 'гипотенуза')}, tg A = ${F('противолежащий', 'прилежащий')}. Медиана к гипотенузе равна половине гипотенузы.</p>
<h3>Четырёхугольники</h3><table><tr><td>Параллелограмм</td><td>S = ah = ab sin α</td></tr><tr><td>Трапеция</td><td>S = ${F('a+b', '2')}·h</td></tr><tr><td>Ромб</td><td>S = ½d₁d₂</td></tr></table>
<h3>Окружность</h3><p>Вписанный угол равен половине центрального, опирающегося на ту же дугу. Угол, опирающийся на диаметр, — прямой. Касательная перпендикулярна радиусу в точке касания. Длина окружности 2πR, площадь круга πR<sup>2</sup>.</p>`,
    sum: ['Сумма углов треугольника 180°', 'c² = a² + b² (Пифагор)', 'c² = a² + b² − 2ab cos γ', 'S = ½ab sin γ', 'Вписанный угол = ½ центрального', 'Трапеция: S = (a + b)/2 · h'],

  T({ id: 'm16', title: 'Координаты', short: 'Расстояние, середина отрезка, уравнения прямой и окружности',

  T({ id: 'm17', title: 'Вероятность', short: 'Классическая вероятность, теоремы сложения и умножения, случайные величины',
    theory: `<h3>Классическое определение</h3><p>P(A) = ${F('m', 'n')}, где n — число всех равновозможных исходов, m — благоприятных. 0 ≤ P ≤ 1.</p>

  T({ id: 'm20', title: 'Экономические задачи', short: 'Вклады, кредиты: дифференцированные и аннуитетные платежи',

  T({ id: 'm21', title: 'Задания повышенной сложности', short: 'Прикладные модели, параметры, теория чисел — подход к части 2',
    theory: `<h3>Структура второй части (по проекту ЕГЭ-2027)</h3><p>Ниже — ориентир по проекту КИМ (август 2026); сверяйтесь с утверждённой демоверсией ФИПИ. Задания с развёрнутым ответом: тригонометрическое уравнение, стереометрия, неравенство, <b>новая прикладная задача на моделирование</b> (перевод реальной ситуации в математическую модель), планиметрия, параметр, теория чисел.</p>

<h3>Параметр</h3><p>Основные методы: графический (семейство графиков в плоскости x–a), аналитический (свойства квадратного трёхчлена, монотонность), метод симметрии.</p>

    sum: ['Часть 2 — развёрнутое решение с обоснованием', 'Новое по проекту 2027: задача на моделирование', 'Уравнения: решение + отбор корней', 'Параметр: графика в осях (x; a)', 'Теория чисел: оценка + пример'],
